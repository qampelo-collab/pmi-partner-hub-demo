<!DOCTYPE html>
<!--
  PMI Enterprise Partner Hub — v4.2

  Three administrator roles. The design note, for whoever reads this next:

  "Three admin levels" sounds like one ladder. It is not. Two independent things
  are being described —

    CAPABILITY : what kind of decision you are allowed to make
    SCOPE      : how much of the organisation you make it for

  They do not correlate. The Group L&D operations person administers the whole
  enterprise and holds no budget. A division director has narrow scope and
  complete authority inside it. A single 1-2-3 ladder cannot express either, so
  this build keeps them separate: three roles, each carrying a scope.

  The rule that shapes every screen:

    You see the decisions you can make, and the evidence for them.
    Everything else is available on request, not by default.

  Which produces the counter-intuitive result that the Sponsor — the most senior
  role, with access to everything — has the SMALLEST default navigation. An
  executive handed fifteen menu items uses none of them.

  All data illustrative. Northwind Industries is fictional.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PMI Enterprise Partner Hub — v4.2 · Three admin roles (Illustrative Demo)</title>
<style>
:root{
  --ink:#200F3B;
  --ink-2:#453a63;
  --muted:#5A5A6E;
  --bg:#F7F4EF;
  --surface:#FFFFFF;
  --line:#E3DED5;
  --line-soft:#EFEAE2;
  --violet:#4F17A8;
  --violet-2:#6B32C9;
  --violet-soft:#F1EBFB;
  --aqua:#00799E;
  --aqua-soft:#EEF6F8;
  --cyan:#05BFE0;
  --orange:#FF610F;
  --orange-dk:#D5340B;
  --tan:#BE9577;
  --amber:#B0790C;
  --good:#166F4A;
  --good-soft:#E7F3EE;
  --warn:#B0790C;
  --warn-soft:#FBF2DF;
  --crit:#C0301C;
  --crit-soft:#FBEBE8;
  --c1:#6B32C9; --c2:#00799E; --c3:#D5340B; --c4:#0E96B0; --c5:#B0790C;
  --radius:10px;
  --radius-lg:14px;
  --shadow:0 1px 2px rgba(32,15,59,.05);
  --shadow-hover:0 6px 18px rgba(32,15,59,.09);
  --shadow-lg:0 18px 50px rgba(32,15,59,.18);
  --sidebar:264px;
  --fast:120ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Aptos","Aptos Display","Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.011em; text-wrap:balance}
p{margin:0; text-wrap:pretty}
::selection{background:var(--violet); color:#fff}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}
input,select,textarea{font:inherit; color:inherit}
a{color:var(--violet); text-decoration:none; transition:color var(--fast)}
a:hover{color:var(--violet-2); text-decoration:underline; text-underline-offset:2px}
table{border-collapse:collapse; width:100%}

/* ---------- App shell ---------- */
.app{display:grid; grid-template-columns:var(--sidebar) 1fr; min-height:100vh}

/* Topbar */
.topbar{
  position:sticky; top:0; z-index:60; grid-column:1 / -1;
  display:flex; align-items:center; gap:16px;
  height:58px; padding:0 18px;
  background:var(--ink); color:#fff;
  transition:box-shadow var(--fast);
}
body.scrolled .topbar{box-shadow:0 4px 18px rgba(32,15,59,.16)}
.topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
  background:linear-gradient(90deg,var(--violet) 0%,var(--violet-2) 18%,var(--aqua) 38%,var(--cyan) 56%,var(--orange) 78%,var(--orange-dk) 100%);
}
.envchip.demo{background:rgba(255,97,15,.2); color:#FFB68C; border-color:rgba(255,97,15,.42)}
.brand{display:flex; align-items:center; gap:10px; min-width:calc(var(--sidebar) - 18px)}
.brand .mark{
  width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--violet-2),var(--cyan)); font-weight:800; font-size:12px; letter-spacing:.02em;
}
.brand .name{font-weight:700; font-size:14.5px; letter-spacing:-.01em}
.brand .sub{font-size:10.5px; color:#B9AEDC; letter-spacing:.06em; text-transform:uppercase; margin-top:-2px}
.orgswitch{
  display:flex; align-items:center; gap:9px; padding:6px 11px; border-radius:8px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14); cursor:pointer;
}
.orgswitch .logo{width:20px;height:20px;border-radius:4px;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:9.5px;font-weight:800}
.orgswitch .t{font-size:12.5px; font-weight:600}
.orgswitch .c{font-size:10.5px; color:#B9AEDC}
.persona-toggle{display:flex; align-items:center; gap:2px; padding:2px; border-radius:9px; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14)}
.persona-btn{padding:6px 12px; border-radius:7px; font-size:12px; font-weight:650; color:#C9BEE8}
.persona-btn.on{background:#fff; color:var(--ink)}
.persona-btn:not(.on):hover{color:#fff}
.gsearch{flex:1; max-width:460px; position:relative}
.gsearch input{
  width:100%; height:34px; border-radius:8px; padding:0 12px 0 34px;
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.14); color:#fff; outline:none;
}
.gsearch input::placeholder{color:#A79BCF}
.gsearch input:focus{background:rgba(255,255,255,.16); border-color:var(--cyan)}
.gsearch .ico{position:absolute; left:11px; top:8px; opacity:.75}
.tb-right{margin-left:auto; display:flex; align-items:center; gap:8px}
.iconbtn{
  position:relative; width:34px;height:34px;border-radius:8px; display:grid;place-items:center;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.13);
}
.iconbtn:hover{background:rgba(255,255,255,.16)}
.dot{position:absolute; top:6px; right:6px; width:7px;height:7px;border-radius:50%; background:var(--orange); border:1.5px solid var(--ink)}
.badge-count{
  position:absolute; top:-5px; right:-5px; min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--orange); color:#fff; font-size:10px; font-weight:700; display:grid;place-items:center; border:1.5px solid var(--ink)
}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--aqua),var(--violet-2));display:grid;place-items:center;font-size:11.5px;font-weight:700}
.envchip{
  font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  padding:4px 8px; border-radius:5px; background:rgba(5,191,224,.16); color:var(--cyan); border:1px solid rgba(5,191,224,.3);
}

/* Sidebar */
.sidebar{
  position:sticky; top:58px; align-self:start; height:calc(100vh - 58px); overflow-y:auto;
  background:var(--surface); border-right:1px solid var(--line); padding:14px 12px 30px;
}
.navgroup{margin-bottom:16px}
.navgroup h5{
  margin:0 0 6px 10px; font-size:10px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:#8C86A0;
}
.navitem{
  position:relative; transition:background var(--fast), color var(--fast);
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 10px; border-radius:8px; font-size:13px; font-weight:500; color:var(--ink-2);
  margin-bottom:1px;
}
.navitem:hover{background:var(--bg)}
.navitem.active{background:var(--violet-soft); color:var(--violet); font-weight:650}
.navitem.active svg{color:var(--violet)}
.navitem.active::before{
  content:''; position:absolute; left:-12px; top:7px; bottom:7px; width:3px;
  border-radius:0 3px 3px 0; background:var(--violet);
}
.navitem svg{width:17px;height:17px;flex:none;color:#8C86A0}
.navitem .pill{
  margin-left:auto; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:20px;
  background:var(--violet); color:#fff;
}
.navitem .pill.alt{background:var(--orange)}
.navitem .pill.ghost{background:var(--line-soft); color:var(--muted)}
.sidefoot{
  margin:18px 6px 0; padding:12px; border-radius:var(--radius); background:var(--aqua-soft);
  border:1px solid #D7E9EF;
}
.sidefoot h6{margin:0 0 4px; font-size:12px; font-weight:700}
.sidefoot p{font-size:11.5px; color:var(--muted); margin-bottom:8px}

/* Main */
.main{padding:22px 26px 76px; max-width:1560px; min-width:0; overflow-x:hidden}
.pagehead{display:flex; align-items:flex-start; gap:18px; margin-bottom:20px; flex-wrap:wrap}
.pagehead h1{font-size:23px}
.pagehead .sub{color:var(--muted); font-size:13px; margin-top:3px; max-width:760px}
.pagehead .actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.crumbs{font-size:11.5px; color:var(--muted); margin-bottom:6px; letter-spacing:.02em}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 14px; border-radius:8px;
  font-size:13px; font-weight:600; border:1px solid transparent; white-space:nowrap;
}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--violet); color:#fff}
.btn-primary:hover{background:#3F0F8C}
.btn-ghost{background:var(--surface); border-color:var(--line); color:var(--ink)}
.btn-ghost:hover{border-color:#C9C0B2; background:#FCFAF7}
.btn-quiet{background:transparent; color:var(--violet)}
.btn-quiet:hover{background:var(--violet-soft)}
.btn-accent{background:var(--orange); color:#fff}
.btn-accent:hover{background:var(--orange-dk)}
.btn-sm{height:28px; padding:0 10px; font-size:12.5px; border-radius:7px}
.btn-sm svg{width:13px;height:13px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn[data-busy]{opacity:1; cursor:progress}
.spin{
  width:13px; height:13px; border-radius:50%; flex:none; opacity:.9;
  border:2px solid currentColor; border-top-color:transparent; animation:spin .62s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{
  border-radius:6px; background:linear-gradient(90deg,var(--line-soft) 25%,#F6F2EB 50%,var(--line-soft) 75%);
  background-size:400% 100%; animation:shimmer 1.2s ease-in-out infinite;
}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

/* Cards & layout */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); min-width:0}
.card-h{display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--line-soft)}
.card-h h3{font-size:14.5px}
.card-h .sub{font-size:12px; color:var(--muted)}
.card-h .right{margin-left:auto; display:flex; gap:8px; align-items:center}
.card-b{padding:18px}
.card-b.tight{padding:0; overflow-x:auto}
.grid{display:grid; gap:16px; min-width:0}
.grid > *{min-width:0}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-23{grid-template-columns:2fr 1fr}
.g-32{grid-template-columns:1.6fr 1fr}
@media(max-width:1150px){.g-4{grid-template-columns:repeat(2,1fr)} .g-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1300px){.g-23,.g-32{grid-template-columns:1fr}}
.stack{display:flex; flex-direction:column; gap:16px; min-width:0}
.stack > *{min-width:0}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}

/* KPI tiles */
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:13px 15px; box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.02em; display:flex; align-items:flex-start; gap:6px; min-height:2.4em; line-height:1.2}
.kpi .val{font-size:26px; font-weight:700; letter-spacing:-.025em; margin:3px 0 1px; font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px; font-weight:600; color:var(--muted); letter-spacing:0}
.kpi .delta{font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:5px}
.up{color:#166F4A} .down{color:var(--crit)} .flat{color:var(--muted)}
.kpi .spark{margin-top:6px}
.kpi .track{height:5px;border-radius:3px;background:var(--line-soft); overflow:hidden; margin-top:8px}
.kpi .track i{display:block;height:100%;border-radius:3px}

/* Chips / tags */
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px;
  font-size:11.5px; font-weight:600; border:1px solid var(--line); background:var(--bg); color:var(--ink-2);
}
.chip.violet{background:var(--violet-soft); border-color:#DFD1F6; color:var(--violet)}
.chip.aqua{background:var(--aqua-soft); border-color:#CFE5EC; color:var(--aqua)}
.chip.orange{background:#FEEEE6; border-color:#F8D6C4; color:var(--orange-dk)}
.chip.good{background:var(--good-soft); border-color:#CDE6DB; color:#166F4A}
.chip.warn{background:var(--warn-soft); border-color:#EEDDB4; color:#8A5E08}
.chip.crit{background:var(--crit-soft); border-color:#F3CFC8; color:var(--crit)}
.chip.tan{background:#F7F0E9; border-color:#E7D8C7; color:#7A5B3E}
.chip i{width:6px;height:6px;border-radius:50%; background:currentColor; display:block}
.chip.sm{font-size:10.5px; padding:2px 7px}

/* Filter bar */
.filters{
  display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 14px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:16px;
}
.fchip{
  padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:600;
  border:1px solid var(--line); background:var(--bg); color:var(--ink-2);
}
.fchip:hover{border-color:#C9C0B2}
.fchip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.sel, .txt{
  height:32px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
  padding:0 10px; font-size:12.5px; outline:none;
}
.sel:focus,.txt:focus{border-color:var(--violet)}
.searchwrap{position:relative}
.searchwrap .txt{padding-left:30px; min-width:250px}
.searchwrap svg{position:absolute; left:9px; top:8px; width:15px;height:15px; color:var(--muted)}
.spacer{margin-left:auto}
.resultbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:12.5px; color:var(--muted); margin-bottom:12px; min-height:28px;
}
.resultbar b{color:var(--ink)}
.filterchip{display:inline-flex; align-items:center; gap:6px; padding:4px 8px 4px 11px; font-size:11.5px}
.filterchip svg{opacity:.7}
.filterchip:hover{background:var(--crit); border-color:var(--crit)}

/* Tables */
.tbl{font-size:13px}
.tbl th{
  text-align:left; font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  font-weight:700; padding:10px 14px; border-bottom:1px solid var(--line); background:#FCFAF7; position:sticky; top:0;
}
.tbl td{padding:11px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
.tbl tbody tr{transition:background var(--fast)}
.tbl tbody tr:hover{background:#FCFAF7}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl th:first-child, .tbl td:first-child{padding-left:18px}
.tbl th:last-child, .tbl td:last-child{padding-right:18px}
.tbl .num{text-align:right; font-variant-numeric:tabular-nums}
.tbl .strong{font-weight:650}
.tbl .sub{font-size:11.5px; color:var(--muted)}
.checkcell{width:36px}
input[type=checkbox]{width:15px;height:15px; accent-color:var(--violet); cursor:pointer}
.tblwrap{overflow-x:auto; max-height:none}
.avatar-sm{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.person{display:flex; align-items:center; gap:9px}

/* Progress bars */
.bar{height:7px; border-radius:4px; background:var(--line-soft); overflow:hidden; min-width:90px}
.bar i{display:block;height:100%; border-radius:4px; background:var(--violet)}
.barlab{display:flex; align-items:center; gap:9px}
.barlab .pct{font-size:11.5px; font-weight:650; color:var(--muted); min-width:34px; text-align:right; font-variant-numeric:tabular-nums}

/* Solution cards */
.solgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:15px}
.vpcard h3{min-height:2.6em; display:flex; align-items:flex-start}
.vpcard > .card-b > p{min-height:4.4em}
.sol{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:0; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s;
}
.sol:hover{transform:translateY(-2px); box-shadow:var(--shadow-hover); border-color:#D6CDBE}
.sol .stripe{height:4px}
.sol .body{padding:15px 16px 0; flex:1; display:flex; flex-direction:column}
.sol .top{display:flex; align-items:flex-start; gap:10px; margin-bottom:9px; min-height:2.6em}
.sol h4{font-size:14.5px; line-height:1.3; margin:0}
.sol .kind{font-size:10.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.sol p.desc{font-size:12.5px; color:var(--muted); line-height:1.48; margin-bottom:11px; min-height:4.44em}
.sol .meta{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; align-content:flex-start}
.sol .foot{
  display:flex; align-items:center; gap:8px; padding:11px 16px; border-top:1px solid var(--line-soft); background:#FCFAF7;
}
.sol .price{font-size:12.5px; font-weight:650}
.sol .price small{font-weight:500; color:var(--muted)}
.sol .foot .btns{margin-left:auto; display:flex; gap:6px}
.owned{outline:1.5px solid #CDE6DB}
.ribbon{
  position:absolute; top:10px; right:-1px; font-size:10px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; padding:3px 9px; border-radius:5px 0 0 5px; background:var(--good-soft); color:#166F4A;
}

/* Domain banner */
.domains{display:grid; grid-template-columns:repeat(6,1fr); gap:11px; margin-bottom:18px}
@media(max-width:1300px){.domains{grid-template-columns:repeat(3,1fr)}}
.dom{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:13px; text-align:left; box-shadow:var(--shadow); position:relative; overflow:hidden;
  display:grid; grid-template-rows:auto auto 1fr; row-gap:4px; align-content:start;
}
.dom:hover{border-color:#C9C0B2}
.dom.on{border-color:var(--violet); box-shadow:0 0 0 2px var(--violet-soft)}
.dom .ic{width:28px;height:28px;border-radius:7px; display:grid;place-items:center; margin-bottom:5px}
.dom .ic svg{width:15px;height:15px;color:#fff}
.dom h4{font-size:12.5px; line-height:1.3; margin:0; min-height:2.6em; display:flex; align-items:flex-start}
.dom span{font-size:11px; color:var(--muted); line-height:1.38}

/* Drawer */
.scrim{position:fixed; inset:0; background:rgba(32,15,59,.42); z-index:80; opacity:0; pointer-events:none; transition:opacity .18s}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; height:100vh; width:640px; max-width:94vw; background:var(--bg);
  z-index:90; box-shadow:var(--shadow-lg); transform:translateX(102%); transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.drawer-h{padding:18px 22px; background:var(--surface); border-bottom:1px solid var(--line)}
.drawer-b{padding:20px 22px 30px; overflow-y:auto; flex:1}
.drawer-f{padding:14px 22px; background:var(--surface); border-top:1px solid var(--line); display:flex; gap:9px; align-items:center}
.closex{position:absolute; top:16px; right:18px; width:30px;height:30px;border-radius:7px; display:grid;place-items:center; color:var(--muted)}
.closex:hover{background:var(--line-soft)}

/* Modal */
.modal{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-48%) scale(.98); z-index:95;
  width:620px; max-width:94vw; max-height:88vh; background:var(--bg); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:.18s; display:flex; flex-direction:column;
}
.modal.open{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1)}
.modal-h{padding:17px 20px; background:var(--surface); border-bottom:1px solid var(--line); border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.modal-b{padding:18px 20px; overflow-y:auto}
.modal-f{padding:13px 20px; background:var(--surface); border-top:1px solid var(--line); display:flex; gap:9px; border-radius:0 0 var(--radius-lg) var(--radius-lg)}

/* Tabs */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto}
.tab{
  padding:9px 14px; font-size:13px; font-weight:600; color:var(--muted);
  border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--violet); border-bottom-color:var(--violet)}
.tab .n{font-size:11px; background:var(--line-soft); color:var(--muted); padding:1px 6px; border-radius:10px; margin-left:6px}
.tab.on .n{background:var(--violet-soft); color:var(--violet)}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block; font-size:12.5px; font-weight:650; margin-bottom:5px}
.field .hint{font-size:11.5px; color:var(--muted); margin-top:4px}
.field .txt, .field .sel, .field textarea{
  width:100%; border-radius:8px; border:1px solid var(--line); background:var(--surface); padding:8px 10px; outline:none; font-size:13px;
}
.field textarea{min-height:76px; resize:vertical; font-family:inherit}
.field .txt:focus,.field .sel:focus,.field textarea:focus{border-color:var(--violet); box-shadow:0 0 0 3px var(--violet-soft)}
.f2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.toggle{width:38px;height:21px;border-radius:12px;background:#CFC8BC; position:relative; transition:.15s; flex:none}
.toggle i{position:absolute; top:2.5px; left:2.5px; width:16px;height:16px;border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--violet)}
.toggle.on i{left:19.5px}
.setrow{display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--line-soft)}
.setrow:last-child{border-bottom:none}
.setrow .txtblk{flex:1}
.setrow .txtblk b{font-size:13px; font-weight:650; display:block}
.setrow .txtblk span{font-size:12px; color:var(--muted)}

/* Misc */
.notice{
  display:flex; gap:11px; padding:12px 14px; border-radius:var(--radius); font-size:12.5px;
  border:1px solid; align-items:flex-start;
}
.notice svg{width:16px;height:16px;flex:none;margin-top:1px}
.notice.info{background:var(--aqua-soft); border-color:#CFE5EC; color:#0A5A73}
.notice.warn{background:var(--warn-soft); border-color:#EEDDB4; color:#7A5305}
.notice.violet{background:var(--violet-soft); border-color:#DFD1F6; color:var(--violet)}
.notice b{font-weight:700}
.kv{display:grid; grid-template-columns:150px 1fr; gap:8px 14px; font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; font-weight:600}
.list-clean{list-style:none; padding:0; margin:0}
.li{display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line-soft); align-items:flex-start}
.li:last-child{border-bottom:none}
.li .ic{width:30px;height:30px;border-radius:8px; display:grid;place-items:center; flex:none}
.li .ic svg{width:15px;height:15px}
.li .t{font-size:13px; font-weight:600; display:block}
.li .d{font-size:11.5px; color:var(--muted); display:block; line-height:1.4}
.li .r{margin-left:auto; text-align:right; font-size:11.5px; color:var(--muted); white-space:nowrap}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:10px}
.legend span{display:flex; align-items:center; gap:6px}
.legend i{width:9px;height:9px;border-radius:3px; display:block}
.hr{height:1px; background:var(--line-soft); margin:16px 0}
.mono{font-variant-numeric:tabular-nums}
.empty{padding:40px; text-align:center; color:var(--muted); font-size:13px}
.hidden{display:none !important}
.stepper{display:flex; gap:0; margin-bottom:18px}
.step{flex:1; padding:9px 12px; background:var(--surface); border:1px solid var(--line); font-size:12.5px; font-weight:600; color:var(--muted); position:relative}
.step:first-child{border-radius:8px 0 0 8px}
.step:last-child{border-radius:0 8px 8px 0}
.step.done{background:var(--good-soft); color:#166F4A; border-color:#CDE6DB}
.step.now{background:var(--violet); color:#fff; border-color:var(--violet)}
.step .n{display:inline-grid; place-items:center; width:18px;height:18px;border-radius:50%; background:rgba(0,0,0,.08); font-size:10.5px; margin-right:7px}
.step.now .n{background:rgba(255,255,255,.25)}
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); z-index:120;
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:9px; font-size:13px; font-weight:600;
  box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:.2s; display:flex; gap:9px; align-items:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.protobadge{
  pointer-events:none;
  position:fixed; bottom:14px; right:14px; z-index:70; font-size:10.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; padding:5px 10px; border-radius:20px; background:var(--ink); color:#fff; opacity:.72;
}

/* ============ RESPONSIVE ============ */
.hamb{
  display:none; width:34px;height:34px;border-radius:8px; place-items:center; flex:none;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.13); color:#fff;
}
.hamb:hover{background:rgba(255,255,255,.18)}

@media (max-width:1320px){
  .gsearch{max-width:300px}
  .brand{min-width:auto}
  .main{padding:20px 20px 60px}
}

/* Icon rail: keeps navigation permanently visible on 1280px laptops */
@media (min-width:1101px) and (max-width:1320px){
  .app{grid-template-columns:60px 1fr}
  .sidebar{padding:12px 8px 26px}
  .navgroup{margin-bottom:9px; padding-bottom:9px; border-bottom:1px solid var(--line-soft)}
  .navgroup:last-of-type{border-bottom:none; margin-bottom:0}
  .navgroup h5{display:none}
  .navitem{justify-content:center; padding:9px 0; margin-bottom:3px}
  .navitem > span:not(.pill){display:none}
  .navitem svg{width:19px; height:19px}
  .navitem.active::before{left:-8px}
  .navitem .pill{
    position:absolute; top:1px; right:1px; margin:0; min-width:15px; height:15px;
    padding:0 4px; font-size:9.5px; line-height:15px;
  }
  .sidefoot{display:none}
}

@media (max-width:1100px){
  .hamb{display:grid}
  .app{grid-template-columns:1fr}
  .sidebar{
    position:fixed; top:58px; left:0; width:282px; height:calc(100vh - 58px);
    z-index:88; transform:translateX(-104%); transition:transform .22s cubic-bezier(.4,0,.2,1);
    box-shadow:var(--shadow-lg);
  }
  body.nav-open .sidebar{transform:translateX(0)}
  .brand .sub{display:none}
  .brand .name{font-size:13.5px}
  .orgswitch .c{display:none}
  .g-32,.g-23{grid-template-columns:1fr}
}

@media (max-width:1000px){
  .card-b.tight{overflow-x:auto}
  .tblwrap{overflow-x:auto}
  .tbl{min-width:660px}
  .stepper{overflow-x:auto}
  .step{min-width:150px}
  .domains{grid-template-columns:repeat(3,1fr)}
}

@media (max-width:900px){
  .gsearch{display:none}
  .envchip:not(.demo){display:none}
  .main{padding:18px 16px 60px}
  .pagehead{gap:12px}
  .pagehead h1{font-size:20px}
  .pagehead .actions{margin-left:0; width:100%}
  .g-4,.g-3,.g-2{grid-template-columns:repeat(2,1fr)}
  .kpi .val{font-size:25px}
  .f2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr; gap:2px 0}
  .kv dd{margin-bottom:8px}
  .solgrid{grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr))}
}

@media (max-width:680px){
  .topbar{gap:10px; padding:0 12px}
  .orgswitch{padding:5px 8px}
  .orgswitch .t{max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .persona-btn{padding:5px 8px; font-size:11px}
  .g-4,.g-3,.g-2{grid-template-columns:1fr}
  .domains{grid-template-columns:repeat(2,1fr)}
  .card-h{flex-wrap:wrap; gap:8px; padding:13px 14px}
  .card-h .right{margin-left:0; width:100%}
  .card-b{padding:14px}
  .drawer{width:100%; max-width:100%}
  .drawer-f{flex-wrap:wrap}
  .modal{width:100%; max-width:100%; max-height:92vh; border-radius:12px}
  .filters{padding:10px}
  .sel,.txt{font-size:12.5px}
  .searchwrap .txt{min-width:0; width:100%}
  .searchwrap{width:100%}
  .protobadge{font-size:9px; padding:4px 8px; right:8px; bottom:8px; max-width:70vw}
}

@media (max-width:680px){
  .tb-optional{display:none}
}

@media (max-width:560px){
  .brand .name{display:none}
  .brand .mark{width:28px;height:28px;font-size:11px}
  .orgswitch .t{max-width:80px}
  .orgswitch svg{display:none}
  .persona-toggle{gap:2px}
  .persona-btn{padding:4px 7px; font-size:10.5px}
  .avatar{width:30px;height:30px;font-size:11px}
  .iconbtn{width:32px;height:32px}
}

@media (max-width:460px){
  .domains{grid-template-columns:1fr}
  .brand .name{display:none}
  .brand .mark{width:26px;height:26px;font-size:10.5px}
  .topbar{gap:7px; padding:0 9px}
  .orgswitch .t{max-width:72px}
  .orgswitch svg{display:none}
  .persona-toggle{gap:0}
  .persona-btn{padding:4px 6px; font-size:10px}
  .avatar{width:28px;height:28px;font-size:10.5px}
  .iconbtn{width:30px;height:30px}
  .pagehead h1{font-size:18.5px}
  .kpi .val{font-size:23px}
  .btn{padding:0 11px; font-size:12.5px}
  .sidebar{width:88vw}
}

/* ---------- Interaction finish ---------- */
.btn,.fchip,.chip,.tab,.iconbtn,.dom,.persona-btn,.orgswitch,.step,.toggle,.closex,.sel,.txt{
  transition:background var(--fast), color var(--fast), border-color var(--fast),
             box-shadow var(--fast), transform var(--fast);
}
.btn:active:not(:disabled),.iconbtn:active,.fchip:active{transform:translateY(1px)}
.btn-primary:hover{box-shadow:0 2px 8px rgba(79,23,168,.28)}
.btn-accent:hover{box-shadow:0 2px 8px rgba(213,52,11,.26)}
.orgswitch:hover{background:rgba(255,255,255,.16)}
.dom.on{box-shadow:0 0 0 2px var(--violet-soft), var(--shadow)}
.sel:focus,.txt:focus{box-shadow:0 0 0 3px var(--violet-soft)}

:where(button,a,input,select,textarea,summary,[tabindex]):focus-visible{
  outline:2px solid var(--violet); outline-offset:2px; border-radius:7px;
}
.topbar :where(button,input):focus-visible{outline-color:var(--cyan); outline-offset:1px}
.tbl :where(button,a):focus-visible{outline-offset:1px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important; animation-duration:.01ms !important}
  .sol:hover{transform:none}
}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D8D1C5; border-radius:10px; border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
html{scrollbar-color:#D8D1C5 transparent}

/* ============================================================
   v4 — accessibility, assessment engine, money layer
   ============================================================ */

/* ---------- a11y foundations ---------- */
.skiplink{
  position:absolute; left:8px; top:-60px; z-index:200;
  background:#fff; color:var(--ink); padding:9px 14px; border-radius:8px;
  font-weight:650; font-size:13px; box-shadow:var(--shadow-lg);
  transition:top var(--fast);
}
.skiplink:focus{top:8px}
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important}
}

/* ---------- recommended-step banner ---------- */
.recostep{
  position:relative; overflow:hidden;
  background:linear-gradient(105deg,#2C1652 0%,#4F17A8 52%,#6B32C9 100%);
  color:#fff; border-radius:var(--radius-lg); padding:18px 20px; margin-bottom:18px;
  display:flex; gap:18px; align-items:center; flex-wrap:wrap;
}
.recostep::after{
  content:''; position:absolute; right:-70px; top:-70px; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle,rgba(5,191,224,.34),transparent 68%); pointer-events:none;
}
.recostep .ic{
  width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.24);
}
.recostep h3{font-size:15.5px; margin:0 0 3px}
.recostep p{font-size:12.5px; color:#D6CBF2; margin:0; max-width:70ch}
.recostep .rs-body{flex:1; min-width:240px; position:relative; z-index:1}
.recostep .rs-act{display:flex; gap:8px; flex:none; position:relative; z-index:1; flex-wrap:wrap}
.recostep .btn-onviolet{background:#fff; color:var(--ink); font-weight:650}
.recostep .btn-onviolet:hover{background:#F1EBFB}
.recostep .btn-ghostviolet{background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.26)}
.recostep .btn-ghostviolet:hover{background:rgba(255,255,255,.2)}
.recostep .rs-steps{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap}
.recostep .rs-steps span{
  font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; font-weight:700;
  padding:3px 8px; border-radius:20px; background:rgba(255,255,255,.12); color:#E4DBFA;
}
.recostep .rs-steps span.on{background:var(--cyan); color:#062A33}

/* ---------- assessment shell ---------- */
.asm{max-width:820px; margin:0 auto}
.asm-wide{max-width:1180px; margin:0 auto}
.asm-top{
  position:sticky; top:58px; z-index:40; background:var(--bg);
  padding:12px 0 14px; margin-bottom:4px; border-bottom:1px solid var(--line);
}
.asm-top .row1{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.asm-top .qcount{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
.asm-track{flex:1; min-width:140px; height:6px; border-radius:3px; background:var(--line-soft); overflow:hidden}
.asm-track i{display:block; height:100%; background:linear-gradient(90deg,var(--violet),var(--cyan)); transition:width 260ms cubic-bezier(.4,0,.2,1)}
.asm-secs{display:flex; gap:5px; margin-top:9px; flex-wrap:wrap}
.asm-sec{
  font-size:11px; font-weight:600; letter-spacing:0;
  padding:3px 9px; border-radius:20px; background:transparent; border:1px solid var(--line); color:var(--muted);
}
.asm-sec.on{background:var(--violet); border-color:var(--violet); color:#fff; font-weight:700}
.asm-sec.done{background:var(--good-soft); border-color:#BFDFD1; color:#166F4A}

/* question card */
.qcard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); padding:24px 24px 20px; margin-top:16px;
  animation:qin 220ms cubic-bezier(.4,0,.2,1);
}
@keyframes qin{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.qcard .qtag{
  display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; margin-bottom:9px;
}
.qcard h2{font-size:19px; line-height:1.35; margin:0 0 6px}
.qcard .qhelp{font-size:12.5px; color:var(--muted); margin:0 0 16px; max-width:64ch}
.qcard .qscen{
  background:var(--violet-soft); border-left:3px solid var(--violet); border-radius:0 8px 8px 0;
  padding:12px 14px; margin:0 0 16px; font-size:13px; color:var(--ink-2); line-height:1.55;
}
.qcard .qscen b{color:var(--ink)}

/* option list (radio / checkbox cards) */
.optlist{display:flex; flex-direction:column; gap:8px; margin:0; padding:0; border:0}
.optlist legend{padding:0; margin:0}
.opt{
  display:flex; align-items:flex-start; gap:11px; padding:12px 14px;
  border:1px solid var(--line); border-radius:10px; background:var(--surface);
  cursor:pointer; transition:border-color var(--fast),background var(--fast),box-shadow var(--fast);
}
.opt:hover{border-color:var(--violet-2); background:var(--violet-soft)}
.opt input{position:absolute; width:1px; height:1px; opacity:0; margin:0; clip:rect(0 0 0 0); clip-path:inset(50%); overflow:hidden}
.opt .mk{
  width:19px;height:19px;flex:none;margin-top:1px;border-radius:50%;
  border:2px solid #B9B0C9; display:grid; place-items:center; transition:all var(--fast);
}
.opt.cb .mk{border-radius:5px}
.opt .mk i{width:9px;height:9px;border-radius:50%;background:#fff;transform:scale(0);transition:transform var(--fast);display:block}
.opt.cb .mk i{border-radius:2px}
.opt .ot{font-size:13.5px; font-weight:600; display:block}
.opt .od{font-size:12px; color:var(--muted); display:block; margin-top:2px}
.opt:has(input:checked){border-color:var(--violet); background:var(--violet-soft); box-shadow:0 0 0 1px var(--violet)}
.opt.dim{opacity:.62}
.opt.dim:hover{opacity:1}
.opt:has(input:checked) .mk{border-color:var(--violet); background:var(--violet)}
.opt:has(input:checked) .mk i{transform:scale(1)}
.opt:has(input:focus-visible){outline:2px solid var(--violet); outline-offset:2px}

/* scale */
.scale{display:flex; gap:8px; margin-bottom:8px}
.scale .sbtn{
  flex:1; min-width:0; padding:14px 6px 11px; border:1px solid var(--line); border-radius:10px;
  background:var(--surface); text-align:center; transition:all var(--fast); cursor:pointer;
}
.scale .sbtn:hover{border-color:var(--violet-2); background:var(--violet-soft)}
.scale .sbtn .n{display:block; font-size:19px; font-weight:750; font-variant-numeric:tabular-nums; line-height:1}
.scale .sbtn .l{display:block; font-size:10.5px; color:var(--muted); margin-top:6px; line-height:1.3; text-wrap:balance}
.scale .sbtn.on{background:var(--violet); border-color:var(--violet); color:#fff}
.scale .sbtn:has(input:focus-visible){outline:2px solid var(--violet); outline-offset:2px}
.scale .sbtn.on .l{color:#D6CBF2}
.scale-ends{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted)}
.qcard .qna{margin-top:12px; font-size:12px}

/* allocation */
.alloc{display:flex; flex-direction:column; gap:12px}
.alloc-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.alloc-row .an{flex:1; min-width:170px; font-size:13px; font-weight:600}
.alloc-row .an small{display:block; font-weight:400; color:var(--muted); font-size:11.5px}
.alloc-row input[type=range]{flex:1.4; min-width:150px; accent-color:var(--violet); height:22px}
.alloc-row .av{
  width:56px; text-align:right; font-variant-numeric:tabular-nums; font-weight:700; font-size:14px;
}
.alloc-total{
  display:flex; align-items:center; gap:9px; margin-top:6px; padding:10px 13px;
  border-radius:9px; background:var(--bg); border:1px solid var(--line); font-size:12.5px;
}
.alloc-total b{font-variant-numeric:tabular-nums}
.alloc-total.over{background:var(--crit-soft); border-color:#F0CFC8; color:var(--crit)}
.alloc-total.ok{background:var(--good-soft); border-color:#BFDFD1; color:#166F4A}

/* chip select */
.chipsel{display:flex; flex-wrap:wrap; gap:8px}
.chipsel .cs{
  padding:9px 14px; border-radius:22px; border:1px solid var(--line); background:var(--surface);
  font-size:13px; font-weight:600; transition:all var(--fast); cursor:pointer;
}
.chipsel .cs:hover{border-color:var(--violet-2); color:var(--violet)}
.chipsel .cs.on{background:var(--violet); border-color:var(--violet); color:#fff}
.chipsel .cs.on::before{content:'✓ '; font-size:11px}

/* dual matrix (confidence x frequency) */
.dual{display:flex; flex-direction:column; gap:18px}
.dual .dl{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin-bottom:7px}

/* nav buttons */
.asm-nav{display:flex; align-items:center; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line-soft); flex-wrap:wrap}
.asm-nav .sp{margin-left:auto}
.asm-hint{font-size:11.5px; color:var(--muted)}

/* depth chooser */
.depths{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.depth{
  text-align:left; padding:20px; border-radius:var(--radius-lg); border:1.5px solid var(--line);
  background:var(--surface); transition:all var(--fast); cursor:pointer; position:relative; overflow:hidden;
}
.depth:hover{border-color:var(--violet-2); box-shadow:var(--shadow-hover); transform:translateY(-2px)}
.depth.on{border-color:var(--violet); box-shadow:0 0 0 1px var(--violet),var(--shadow-hover)}
.depth .dbar{position:absolute; left:0; top:0; right:0; height:4px}
.depth h4{font-size:15px; margin:6px 0 4px}
.depth .dmeta{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; margin-bottom:9px}
.depth p{font-size:12.5px; color:var(--ink-2); line-height:1.5}
.depth ul{margin:10px 0 0; padding-left:16px; font-size:12px; color:var(--muted); line-height:1.7}
.depth .rec{position:absolute; top:12px; right:12px; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--violet); background:var(--violet-soft); padding:3px 7px; border-radius:5px}

/* ---------- results ---------- */
.band{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:20px}
.vprow{display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.vprow:last-child{border-bottom:0}
.vprow .vpic{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center}
.vprow .vpn{flex:1; min-width:180px}
.vprow .vpn b{font-size:13.5px; display:block}
.vprow .vpn span{font-size:11.5px; color:var(--muted)}
.vprow .vpbar{flex:1.3; min-width:150px; position:relative; height:11px; border-radius:6px; background:var(--line-soft)}
.vprow .vpbar i{position:absolute; left:0; top:0; height:100%; border-radius:6px; display:block; transition:width 500ms cubic-bezier(.4,0,.2,1)}
.vprow .vpbar u{position:absolute; top:-3px; width:2px; height:17px; background:var(--ink); display:block; text-decoration:none}
.vprow .vpsc{width:60px; text-align:right; font-variant-numeric:tabular-nums; font-weight:750; font-size:17px}

.quad{position:relative; width:100%; aspect-ratio:1.35/1; min-height:280px}
.quadlab{position:absolute; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}

.cov{display:flex; height:32px; border-radius:8px; overflow:hidden; border:1px solid var(--line)}
.cov i{display:grid; place-items:center; font-size:11.5px; font-weight:700; color:#fff; min-width:0; overflow:hidden; white-space:nowrap}

.recgroup{border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; margin-bottom:14px; background:var(--surface)}
.recgroup .rh{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.recgroup .rh .rk{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.recgroup .rh h4{font-size:14px; margin:0}
.recgroup .rh .rs{font-size:11.5px; color:var(--muted)}
.recdom{padding:10px 16px 4px; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:7px}
.recitem{display:flex; align-items:flex-start; gap:12px; padding:11px 16px; border-top:1px solid var(--line-soft); flex-wrap:wrap}
.recitem:first-of-type{border-top:0}
.recitem .rt{flex:1; min-width:220px}
.recitem .rt b{font-size:13.5px; display:block}
.recitem .rt span{font-size:12px; color:var(--muted); display:block; margin-top:2px}
.recitem .rp{text-align:right; flex:none; min-width:120px}
.recitem .rp .amt{font-weight:700; font-size:13.5px; font-variant-numeric:tabular-nums}
.recitem .rp .u{font-size:11px; color:var(--muted)}

/* ---------- money ---------- */
.wallet{
  background:linear-gradient(135deg,#200F3B 0%,#3A1C6B 58%,#4F17A8 100%); color:#fff;
  border-radius:var(--radius-lg); padding:22px; position:relative; overflow:hidden;
}
.wallet::after{content:''; position:absolute; right:-60px; bottom:-90px; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle,rgba(5,191,224,.30),transparent 70%)}
.wallet .wl{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:#B9AEDC; font-weight:700}
.wallet .wv{font-size:34px; font-weight:750; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin:4px 0 2px}
.wallet .ws{font-size:12.5px; color:#D6CBF2}
.wallet .wtrack{height:8px; border-radius:4px; background:rgba(255,255,255,.16); margin:16px 0 8px; overflow:hidden; display:flex}
.wallet .wtrack i{display:block; height:100%}
.wallet .wleg{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:#D6CBF2}
.wallet .wleg span{display:inline-flex; align-items:center; gap:6px}
.wallet .wleg u{width:9px;height:9px;border-radius:3px;display:block;text-decoration:none}
.wallet .wact{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; position:relative; z-index:1}

.tierbar{display:flex; gap:3px; margin:14px 0 10px}
.tierseg{flex:1; text-align:center; padding:10px 6px; border-radius:8px; background:var(--bg); border:1px solid var(--line); transition:all var(--fast)}
.tierseg.on{background:var(--violet-soft); border-color:var(--violet)}
.tierseg.done{background:var(--good-soft); border-color:#BFDFD1}
.tierseg b{display:block; font-size:15px; font-variant-numeric:tabular-nums}
.tierseg span{display:block; font-size:10.5px; color:var(--muted); margin-top:2px}

.ccrow{display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.ccrow:last-child{border-bottom:0}
.ccrow .ccn{flex:1; min-width:170px}
.ccrow .ccn b{font-size:13.5px; display:block}
.ccrow .ccn span{font-size:11.5px; color:var(--muted)}
.ccrow .ccb{flex:1.2; min-width:150px}
.ccrow .ccv{text-align:right; min-width:150px; font-variant-numeric:tabular-nums; font-size:12.5px}

.procopt{display:flex; gap:13px; padding:14px 0; border-bottom:1px solid var(--line-soft)}
.procopt:last-child{border-bottom:0}
.procopt .pi{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center}
.procopt b{font-size:13.5px; display:block; margin-bottom:2px}
.procopt p{font-size:12.5px; color:var(--muted); line-height:1.55}
.procopt .pw{font-size:11.5px; color:var(--ink-2); margin-top:5px; display:block}

/* ---------- learner profile ---------- */
.archcard{
  background:linear-gradient(120deg,#200F3B 0%,#4F17A8 55%,#00799E 100%); color:#fff;
  border-radius:var(--radius-lg); padding:26px; display:flex; gap:22px; align-items:center; flex-wrap:wrap;
  position:relative; overflow:hidden;
}
.archcard::after{content:''; position:absolute; left:-40px; top:-60px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,rgba(5,191,224,.28),transparent 70%)}
.archcard .ring{width:96px;height:96px;flex:none;position:relative;z-index:1}
.archcard .at{flex:1; min-width:230px; position:relative; z-index:1}
.archcard .at .k{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:#B9AEDC; font-weight:700}
.archcard .at h2{font-size:24px; margin:4px 0 6px; letter-spacing:-.015em}
.archcard .at p{font-size:13px; color:#E0D8F5; max-width:56ch; line-height:1.55}

.caprow{display:flex; align-items:center; gap:13px; padding:11px 0; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.caprow:last-child{border-bottom:0}
.caprow .cn{flex:1; min-width:132px; font-size:13px; font-weight:600}
.caprow .cn small{display:block; font-weight:400; color:var(--muted); font-size:11.5px}
.caprow .cb{flex:1.4; min-width:120px; position:relative; height:11px; border-radius:6px; background:var(--line-soft)}
.caprow .cb i{position:absolute; left:0; top:0; height:100%; border-radius:6px; display:block}
.caprow .cb u{position:absolute; top:-4px; width:3px; height:19px; border-radius:2px; background:var(--orange); display:block; text-decoration:none}
.caprow .cv{flex:none; width:88px; text-align:right; font-size:12px; font-variant-numeric:tabular-nums; color:var(--muted)}
.caprow .cv b{color:var(--ink); font-size:14px}

.shareblk{display:flex; align-items:flex-start; gap:13px; padding:12px 0; border-bottom:1px solid var(--line-soft)}
.shareblk:last-child{border-bottom:0}
.shareblk .sb{flex:1}
.shareblk .sb b{font-size:13px; display:block}
.shareblk .sb span{font-size:12px; color:var(--muted)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .depths{grid-template-columns:1fr}
  .qcard{padding:20px 18px 18px}
  .qcard h2{font-size:17px}
  .scale{flex-wrap:wrap}
  .scale .sbtn{flex:1 1 30%; min-width:88px}
  .archcard{padding:20px}
  .archcard .at h2{font-size:20px}
  .tierbar{flex-wrap:wrap}
  .tierseg{flex:1 1 44%}
}
@media (max-width:680px){
  .asm-top{top:0; position:relative}
  .recostep{padding:16px}
  .recostep .rs-act{width:100%}
  .recostep .rs-act .btn{flex:1}
  .wallet .wv{font-size:27px}
  .opt{padding:11px 12px}
  .asm-nav .btn{flex:1; min-width:120px}
}

/* ---------- narrow mobile: pre-existing topbar and tab-row overflow ---------- */
@media (max-width:470px){
  .tabs{overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none; white-space:nowrap}
  .stepper{overflow-x:auto; scrollbar-width:none}
  .stepper::-webkit-scrollbar{display:none}
  .step{flex:none; min-width:132px}
  .filters{overflow-x:auto}
}
@media (max-width:430px){
  .topbar{gap:6px; padding:0 8px}
  .brand{min-width:0}
  .gsearch{display:none}
  .envchip{display:none}
  .orgswitch{padding:5px 8px; gap:6px}
  .orgswitch .c{display:none}
  .orgswitch .t{max-width:58px; font-size:11.5px}
  .tb-right{gap:4px}
  .iconbtn{width:28px; height:28px}
  .avatar{width:26px; height:26px; font-size:10px}
  .persona-btn{padding:4px 6px; font-size:10px}
  .main{padding:14px 12px 60px}
  .qcard{padding:16px 14px 14px}
  .qcard h2{font-size:16px}
  .scale .sbtn{flex:1 1 45%}
  .archcard{padding:16px}
  .wallet{padding:16px}
  .recitem, .vprow, .caprow, .ccrow{gap:9px}
}

/* ---------- learner access states ---------- */
.seatnote{
  display:flex; align-items:center; gap:6px; margin-top:9px;
  font-size:11.5px; color:var(--muted); line-height:1.4;
}
.seatnote svg{flex:none; opacity:.8}
.seatnote.warn{color:#8A5E08}

/* ---------- funding composer ---------- */
.fundsplit{
  display:flex; align-items:center; gap:14px; padding:13px 15px; margin-bottom:10px;
  background:var(--bg); border:1px solid var(--line); border-radius:10px; flex-wrap:wrap;
}
.fundsplit .fl{display:block; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:700}
.fundsplit b{font-size:17px; font-variant-numeric:tabular-nums}
.fundsplit .fbar{flex:1; min-width:110px; height:9px; border-radius:5px; background:#DCD5EF; overflow:hidden}
.fundsplit .fbar i{display:block; height:100%; background:var(--violet); transition:width var(--fast)}

/* ---------- request queue ---------- */
.reqcard{
  border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--surface);
  margin-bottom:12px; overflow:hidden;
}
.reqcard.done{opacity:.72; background:var(--bg)}
.reqcard .rq-h{display:flex; align-items:flex-start; gap:13px; padding:14px 16px; flex-wrap:wrap}
.reqcard .rq-av{
  width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  color:#fff; font-size:11.5px; font-weight:700;
}
.reqcard .rq-h b{font-size:13.5px}
.reqcard .rq-sub{font-size:11.5px; color:var(--muted)}
.reqcard .rq-sol{font-size:12.5px; color:var(--ink-2); margin-top:3px}
.reqcard .rq-money{flex:none; text-align:right; min-width:150px}
.reqcard .rq-money .amt{font-size:16px; font-weight:750; font-variant-numeric:tabular-nums}
.reqcard .rq-money .u{font-size:11px; color:var(--muted)}
.reqcard .rq-b{display:flex; gap:0; border-top:1px solid var(--line-soft); flex-wrap:wrap}
.reqcard .rq-col{flex:1; min-width:250px; padding:12px 16px}
.reqcard .rq-impact{border-left:1px solid var(--line-soft)}
.reqcard .rq-lab{
  font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--muted); display:flex; align-items:center; gap:5px; margin-bottom:5px;
}
.reqcard .rq-why{font-size:12.5px; line-height:1.55; color:var(--ink-2); margin:0}
.reqcard .rq-flag{margin-top:7px; font-size:11.5px; color:#8A5E08; display:flex; align-items:center; gap:5px}
.reqcard .rq-f{display:flex; gap:8px; align-items:center; padding:11px 16px; border-top:1px solid var(--line-soft); background:var(--bg); flex-wrap:wrap}
.reqcard .rq-prof{border-top:1px solid var(--line-soft)}
.reqcard .rq-toggle{
  width:100%; text-align:left; padding:11px 16px; font-size:12.5px; font-weight:600; color:var(--violet);
  display:flex; align-items:center; gap:7px;
}
.reqcard .rq-toggle:hover{background:var(--violet-soft)}
.reqcard .rq-profbody{display:none; padding:4px 16px 14px}
.reqcard .rq-profbody.open{display:block}

/* ---------- unmet demand ---------- */
.demandrow{display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.demandrow:last-of-type{border-bottom:0}
.demandrow .dm-ic{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center}

@media (max-width:680px){
  .reqcard .rq-impact{border-left:0; border-top:1px solid var(--line-soft)}
  .reqcard .rq-money{text-align:left; min-width:0; width:100%}
}

/* ---------- narrow-width dialogs ---------- */
@media (max-width:470px){
  .kv{grid-template-columns:1fr; gap:2px 0}
  .kv dt{margin-top:8px}
  .modal-f{flex-wrap:wrap}
  .modal-f .btn{flex:1 1 auto; min-width:110px}
  .modal-f .spacer{display:none}
  .drawer-f{flex-wrap:wrap}
  .drawer-f .btn{flex:1 1 auto; min-width:120px}
  .fundsplit{gap:9px}
  .chipsel .cs{flex:1 1 44%; text-align:center}
}

/* ---------- v4.2 — roles ---------- */
.rolebtn{
  display:flex; align-items:center; gap:9px; padding:5px 10px; border-radius:8px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14); cursor:pointer; color:#fff;
}
.rolebtn:hover{background:rgba(255,255,255,.16)}
.rolebtn .rb-dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.13)}
.rolebtn .rb-t{display:flex;flex-direction:column;line-height:1.2;text-align:left}
.rolebtn .rb-n{font-size:12.5px;font-weight:650}
.rolebtn .rb-s{font-size:10.5px;color:#B9AEDC}
.rolebtn svg{opacity:.7;flex:none}

.rolemenu{
  position:absolute; top:52px; z-index:80; width:370px; max-width:calc(100vw - 24px);
  background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg); padding:6px; display:none;
}
.rolemenu :focus-visible{outline:2px solid var(--violet); outline-offset:-2px}
.rolemenu.open{display:block; animation:qin 140ms cubic-bezier(.4,0,.2,1)}
.rolemenu .rm-h{padding:11px 12px 8px; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.rolemenu .rm-h span{display:block; text-transform:none; letter-spacing:0; font-weight:400; font-size:11.5px; margin-top:4px; color:var(--muted)}
.rolemenu .rm-i{
  display:flex; gap:11px; width:100%; text-align:left; padding:11px 12px; border-radius:10px;
  align-items:flex-start; transition:background var(--fast);
}
.rolemenu .rm-i:hover{background:var(--bg)}
.rolemenu .rm-i.on{background:var(--violet-soft)}
.rolemenu .rm-av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:700}
.rolemenu .rm-t{flex:1;min-width:0}
.rolemenu .rm-t b{font-size:13.5px;display:block}
.rolemenu .rm-r{font-size:11.5px;font-weight:650;display:block;margin-top:1px}
.rolemenu .rm-d{font-size:11.5px;color:var(--muted);display:block;margin-top:3px;line-height:1.45}
.rolemenu .rm-sc{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:5px}
.rolemenu .rm-now{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--violet);flex:none}
.rolemenu .rm-f{padding:10px 12px; border-top:1px solid var(--line-soft); font-size:11.5px; color:var(--muted); display:flex; gap:6px; align-items:flex-start; margin-top:4px}

.rolebadge{padding:10px 12px; margin:0 0 14px; background:var(--surface); border:1px solid var(--line); border-radius:9px}
.rolebadge b{display:block; font-size:12.5px}
.rolebadge span{display:block; font-size:11px; color:var(--muted); margin-top:2px}

.opsdrawer{
  width:100%; text-align:left; padding:10px 12px; margin-top:6px; border-radius:9px;
  border:1px dashed var(--line); color:var(--ink-2); font-size:12.5px; font-weight:600;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
.opsdrawer:hover{border-color:var(--violet-2); color:var(--violet); background:var(--violet-soft)}
.opsdrawer span{width:100%; font-size:11px; font-weight:400; color:var(--muted); padding-left:21px}

.rolecard{background:var(--bg); border:1px solid var(--line); border-radius:11px; padding:15px}
.rc-lab{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.rc-list{list-style:none;padding:0;margin:0;font-size:12px;line-height:1.6}
.rc-list li{display:flex;gap:6px;align-items:flex-start}
.rc-list li svg{flex:none;margin-top:3px;opacity:.75}
.rc-list.muted{color:var(--muted)}
.rc-foot{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}

.unitrow{display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--line-soft); flex-wrap:wrap}
.unitrow:last-of-type{border-bottom:0}
.unitrow .ur-ic{width:32px;height:32px;border-radius:8px;flex:none;display:grid;place-items:center}
.unitrow .ur-n{flex:1.3;min-width:190px}
.unitrow .ur-n b{font-size:13.5px;display:block}
.unitrow .ur-n span{font-size:11.5px;color:var(--muted)}
.unitrow .ur-m{flex:1;min-width:190px}
.unitrow .ur-b{flex:1;min-width:150px}
.unitrow .ur-a{flex:none}
.unitrow .ur-sub{font-size:11px;color:var(--muted);margin-top:4px}

.rq-ceil{font-size:11.5px;color:#8A5E08;display:flex;align-items:center;gap:5px}

.disclose{border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--surface); padding:0}
.disclose > summary{
  padding:14px 16px; cursor:pointer; font-size:13.5px; font-weight:650;
  display:flex; align-items:center; gap:9px; flex-wrap:wrap; list-style:none;
}
.disclose > summary::-webkit-details-marker{display:none}
.disclose > summary:hover{background:var(--bg)}
.disclose > summary span{width:100%; padding-left:23px; font-size:11.5px; font-weight:400; color:var(--muted)}
.disclose[open] > summary{border-bottom:1px solid var(--line-soft)}
.disclose > div{padding:0 16px 16px}

@media (max-width:680px){
  .rolebtn .rb-t{display:none}
  .rolemenu{position:fixed; top:64px; left:10px; right:10px; width:auto; max-width:none}
  .unitrow .ur-a{width:100%}
}

.vprow .vpn span{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}

</style>
</head>

<a class="skiplink" href="#main">Skip to content</a>
<span id="routeAnnounce" class="sr-only" aria-live="polite"></span>

<div class="topbar">
  <button class="hamb" id="hamb" onclick="toggleNav()" aria-label="Menu">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
  </button>
  <div class="brand">
    <div class="mark">PMI</div>
    <div>
      <div class="name">Enterprise Partner Hub</div>
      <div class="sub" id="topbarSub">Admin Console</div>

  </div>
  <button class="orgswitch" onclick="toast('Organisation switcher — Northwind Industries, Northwind Systems, Northwind Mobility')">
    <span class="logo">NW</span>
    <span>
      <span class="t" style="display:block">Northwind Industries</span>
      <span class="c">Enterprise Agreement · EMEA</span>
    </span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
  </button>

function makePeople(n){

  for(let i=0;i<n;i++){
    const f=FIRST[Math.floor(rnd()*FIRST.length)], l=LAST[Math.floor(rnd()*LAST.length)];

    while(prods.length<cnt){const p=pool[Math.floor(rnd()*pool.length)]; if(!prods.includes(p))prods.push(p);}
    out.push({
      id:'L'+(10480+i), first:f, last:l,
      email:`${f.toLowerCase()}.${l.toLowerCase()}@northwind.example`,
      dept:DEPTS[Math.floor(rnd()*DEPTS.length)],

      share: rnd()>0.18,
      seen: ['2 hrs ago','Yesterday','3 days ago','1 week ago','2 weeks ago','Never'][Math.floor(rnd()*6)]

  }

}

function busy(btn,label,done,ms=950){
  if(!btn || btn.dataset.busy) return;

/* sparkline / area chart */
function areaChart(data, color, w=560, h=150){
  const max=Math.max(...data)*1.12, min=0;
  const pts=data.map((v,i)=>[i/(data.length-1)*w, h - (v-min)/(max-min)*h]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${w} ${h} L 0 ${h} Z`;
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="0" y1="${(h*f).toFixed(1)}" x2="${w}" y2="${(h*f).toFixed(1)}" stroke="#EFEAE2" stroke-width="1"/>`).join('');
  const dots=pts.map((p,i)=>i===pts.length-1?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="${color}" stroke="#fff" stroke-width="2"/>`:'').join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="g${color.slice(1)}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g${color.slice(1)})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function sparkline(data,color,w=110,h=26){
  const max=Math.max(...data),min=Math.min(...data);
  const pts=data.map((v,i)=>`${(i/(data.length-1)*w).toFixed(1)},${(h-(v-min)/((max-min)||1)*h*0.82-2).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" style="display:block"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function hbars(rows,max){
  return `<div style="display:flex;flex-direction:column;gap:11px">`+rows.map(r=>`
    <div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px">
        <span style="font-size:12.5px;font-weight:600">${r.n}</span>
        <span style="margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums">${r.lab}</span>
      </div>
      <div style="height:9px;border-radius:5px;background:var(--line-soft);overflow:hidden;display:flex;gap:2px">
        <i style="display:block;height:100%;width:${(r.v/max*100).toFixed(1)}%;background:${r.c};border-radius:5px"></i>
        ${r.v2!==undefined?`<i style="display:block;height:100%;width:${((r.v2-r.v)/max*100).toFixed(1)}%;background:${r.c};opacity:.28;border-radius:0 5px 5px 0"></i>`:''}
      </div>
    </div>`).join('')+`</div>`;
}
function donut(segments,size=150){
  const total=segments.reduce((a,s)=>a+s.v,0); let acc=0; const r=size/2-14, c=size/2, circ=2*Math.PI*r;
  const arcs=segments.map(s=>{
    const frac=s.v/total, dash=`${(circ*frac-2).toFixed(1)} ${(circ-circ*frac+2).toFixed(1)}`;
    const off=circ*0.25 - circ*acc; acc+=frac;
    return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${dash}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${c} ${c})" stroke-linecap="butt"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}">${arcs}<text x="${c}" y="${c-2}" text-anchor="middle" font-size="21" font-weight="700" fill="#200F3B">${total.toLocaleString()}</text><text x="${c}" y="${c+15}" text-anchor="middle" font-size="10.5" fill="#5A5A6E">seats</text></svg>`;
}

/* price parsing for the illustrative cost model */
function priceOf(s){
  if(!s || !s.price) return null;
  const p = s.price;
  if(/Included/i.test(p)) return {amt:0, kind:'included'};
  if(/application|Co-funded/i.test(p)) return {amt:null, kind:'quote'};
  const m = p.replace(/[.,]/g,'').match(/(\d+)/);
  if(!m) return null;
  return {amt:parseInt(m[1],10), kind:/^From/i.test(p) ? 'from' : 'unit'};
}

const secList = qs => qs.reduce((acc,q)=>{ if(!acc.some(s=>s.n===q.sec)) acc.push({n:q.sec, ic:q.secIc, c:q.secColor}); return acc; },[]);

/* ---------- answer helpers ---------- */
function qScore(q, val){
  if(val===undefined || val===null || val==='na') return null;
  if(q.noscore) return null;
  if(q.type==='scale') return (val-1)/4*100;
  if(q.type==='single' || q.type==='scen'){
    const o=(q.opts||[]).find(x=>x.v===val); return o && o.s!==undefined ? o.s : null;
  }
  if(q.type==='multi'){
    const sel = Array.isArray(val)?val:[];
    if(!sel.length) return null;
    const tot = sel.reduce((a,v)=>{const o=(q.opts||[]).find(x=>x.v===v); return a+((o&&o.s)||0);},0);
    return Math.min(100, tot);
  }
  return null;
}
const answered = (q,v) => q.type==='multi' ? (Array.isArray(v)&&v.length>0)
  : q.type==='alloc' ? (v && Object.values(v).reduce((a,b)=>a+b,0)===100)
  : (v!==undefined && v!==null && v!=='');

/* ---------- organisation scoring ---------- */
function asmScore(){
  const qs = asmQuestions();
  const vpScore = {}, dims = {}, conf = {};
  VALUE_PLAYS.forEach(vp=>{
    const mine = qs.filter(q=>q.vp===vp.id);
    const vals = mine.map(q=>({q, s:qScore(q, ASM.a[q.key])})).filter(x=>x.s!==null);
    vpScore[vp.id] = vals.length ? Math.round(vals.reduce((a,x)=>a+x.s,0)/vals.length) : 0;
    conf[vp.id] = vals.length;
    const dm = {};
    vals.forEach(x=>{ (dm[x.q.dim] = dm[x.q.dim] || []).push(x.s); });
    dims[vp.id] = Object.entries(dm).map(([n,arr])=>({n, s:Math.round(arr.reduce((a,b)=>a+b,0)/arr.length)}));
  });

  /* importance from the allocation question, default even */
  const alloc = ASM.a['con.priority'] || {};
  const impTotal = Object.values(alloc).reduce((a,b)=>a+b,0) || 0;
  const importance = {};
  VALUE_PLAYS.forEach(vp=>{ importance[vp.id] = impTotal ? (alloc[vp.id]||0) : Math.round(100/6); });

  const priorities = VALUE_PLAYS.map(vp=>({
    vp, score:vpScore[vp.id], imp:importance[vp.id], gap:100-vpScore[vp.id],
    impact: Math.round(importance[vp.id] * (100-vpScore[vp.id]) / 10)
  })).sort((a,b)=>b.impact-a.impact);

  /* domain relevance */
  const sector = ASM.a['org.sector'] || 'services';
  const rel = Object.assign({}, SECTOR_DOM[sector] || SECTOR_DOM.services);
  (ASM.a['org.portfolio']||[]).forEach(p=>{
    const lift = PORTFOLIO_LIFT[p]||{};
    Object.entries(lift).forEach(([d,r])=>{ if(REL_RANK[r] > REL_RANK[rel[d]]) rel[d]=r; });
  });

  const budget = ASM.a['con.budget'] || 'year';
  const blockers = ASM.a['con.blockers'] || [];
  const units = POP_UNITS[ASM.a['org.projpop']] || 250;

  /* recommendation fit */
  function fit(s, vpEntry){
    if(rel[s.d]==='na') return -1;
    let f = REL_RANK[rel[s.d]] * 10;
    if(s.owned) f += 25;
    const sc = vpEntry.score;
    if(sc < 35 && (s.k==='assess'||s.k==='advisory')) f += 14;
    if(sc >= 35 && sc < 60 && (s.k==='learn'||s.k==='cert')) f += 14;
    if(sc >= 60 && (s.k==='platform'||s.k==='licence'||s.k==='community')) f += 12;
    if(budget==='none') f += s.owned ? 26 : -14;
    if(budget==='small' && !s.owned) f -= 6;
    if(blockers.includes('data') && s.k==='assess') f += 10;
    if(blockers.includes('attention') && s.k==='advisory') f += 10;
    if(blockers.includes('capacity') && (s.k==='platform'||/Managed/.test((s.formats||[]).join(' ')))) f += 8;
    if(blockers.includes('budget') && s.owned) f += 12;
    if(blockers.includes('procure') && s.owned) f += 6;
    return f;
  }

  const recs = priorities.map(p=>{
    const list = SOLUTIONS.filter(s=>s.vp===p.vp.id)
      .map(s=>({s, f:fit(s,p)}))
      .filter(x=>x.f>=0)
      .sort((a,b)=>b.f-a.f)
      .slice(0,4)
      .map(x=>Object.assign({}, x, {cost:estCost(x.s, units)}));
    /* group by domain — value play, then domain, then solution */
    const byDom = [];
    list.forEach(x=>{
      let g = byDom.find(g=>g.d===x.s.d);
      if(!g){ g = {d:x.s.d, dom:domById(x.s.d), rel:rel[x.s.d], items:[]}; byDom.push(g); }
      g.items.push(x);
    });
    return {p, list, byDom};
  });

  const all = recs.flatMap(r=>r.list);
  const inPlan = all.filter(x=>x.s.owned);
  const toAdd  = all.filter(x=>!x.s.owned);
  const addCost = toAdd.reduce((a,x)=>a+(x.cost && x.cost.total ? x.cost.total : 0),0);
  const quoteOnly = toAdd.filter(x=>!x.cost || x.cost.total===null).length;

  const overall = Math.round(VALUE_PLAYS.reduce((a,vp)=>a+vpScore[vp.id],0)/VALUE_PLAYS.length);

  return {vpScore, dims, conf, priorities, rel, recs, inPlan, toAdd, addCost, quoteOnly, overall, units, budget, blockers, sector};
}

/* illustrative cost of adding a solution, at a volume derived from project population */
function estCost(s, units){
  const p = priceOf(s);
  if(!p) return {total:null, note:'Price on application'};
  if(p.kind==='included') return {total:0, note:'Included in your agreement', qty:null};
  if(p.kind==='quote' || p.amt===null) return {total:null, note:'Scoped and quoted individually', qty:null};
  const u = (s.unit||'').toLowerCase();
  let qty = 1, basis = 'one-off';
  if(/per learner|per seat|per member|per employee/.test(u)){
    if(/employee/.test(u)) qty = Math.round(units*3.2);
    else if(/member|seat \/ year|seat\/year/.test(u)) qty = Math.round(units*0.8);
    else qty = Math.max(12, Math.round(units*0.18));
    basis = qty + ' people';
  } else if(/instructor|trainer/.test(u)){ qty = 6; basis='6 people'; }
  else if(/cohort day|workshop day/.test(u)){ qty = 4; basis='4 days'; }
  else if(/business unit|portfolio|pmo|assessment|1,000 employees/.test(u)){ qty = 1; basis='one engagement'; }
  else if(/year|annual|setup/.test(u)){ qty = 1; basis='annual'; }
  return {total:p.amt*qty, qty:qty, basis:basis, from:p.kind==='from'};
}

/* ---------- learner scoring ---------- */
const TARGET_PROFILE = {
  deeper:     {align:65, baseline:65, opmodel:70, capdev:75, credential:60, digital:60},
  bigger:     {align:75, baseline:70, opmodel:75, capdev:80, credential:70, digital:60},
  programme:  {align:85, baseline:80, opmodel:80, capdev:80, credential:75, digital:65},
  pmo:        {align:75, baseline:85, opmodel:90, capdev:65, credential:70, digital:75},
  specialist: {align:65, baseline:80, opmodel:75, capdev:70, credential:85, digital:80},
  lead:       {align:90, baseline:75, opmodel:75, capdev:85, credential:70, digital:65},
  unsure:     {align:70, baseline:70, opmodel:70, capdev:70, credential:70, digital:65}
};
const OUTCOME_LIFT = {cred:{credential:12}, confidence:{capdev:8, align:8}, visible:{align:12},
  money:{credential:8}, move:{baseline:8, credential:8}, balance:{opmodel:10}, teach:{capdev:10}, ai:{digital:16}};

function lrnScore(){
  const qs = lrnQuestions();
  const caps = {};
  LRN_AREAS.forEach(ar=>{
    const mine = qs.filter(q=>q.area===ar.id);
    const vals = mine.map(q=>qScore(q, LRN.a[q.key])).filter(v=>v!==null);
    caps[ar.id] = vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
  });
  const target = Object.assign({}, TARGET_PROFILE[LRN.a['a.target']] || TARGET_PROFILE.unsure);
  (LRN.a['a.outcomes']||[]).forEach(o=>{
    Object.entries(OUTCOME_LIFT[o]||{}).forEach(([k,v])=>{ target[k]=Math.min(100, target[k]+v); });
  });
  const rows = LRN_AREAS.map(ar=>({ar, now:caps[ar.id], want:target[ar.id], gap:Math.max(0, target[ar.id]-caps[ar.id])}));
  const strengths = rows.slice().sort((a,b)=>b.now-a.now).slice(0,2);
  const growth = rows.slice().sort((a,b)=>b.gap-a.gap).slice(0,3).filter(r=>r.gap>0);

  const mean = Math.round(rows.reduce((a,r)=>a+r.now,0)/rows.length);
  const early = ['a','b'].includes(LRN.a['p.years']) && mean < 45;
  let arch = ARCHETYPES.find(t=>t.id==='emerging');
  if(!early){
    const top2 = strengths.map(s=>s.ar.id);
    arch = ARCHETYPES.find(t=>t.pair.length===2 && t.pair.every(p=>top2.includes(p)))
        || ARCHETYPES.find(t=>t.pair.length===2 && t.pair.includes(top2[0]))
        || ARCHETYPES.find(t=>t.id==='anchor');
  }

  /* recommendations: biggest gaps first, sponsored set before priced additions */
  const formats = LRN.a['a.format'] || [];
  const fmtMatch = s => {
    const f=(s.formats||[]).join(' ').toLowerCase();
    let b=0;
    if(formats.includes('live') && /ilt|vilt/.test(f)) b+=8;
    if(formats.includes('cohort') && /cohort/.test(f)) b+=8;
    if(formats.includes('self') && /on-demand|self-paced|digital|subscription/.test(f)) b+=8;
    if(formats.includes('short') && /on-demand|digital/.test(f)) b+=5;
    if(formats.includes('reading') && /digital|subscription|report/.test(f)) b+=5;
    return b;
  };
  const held = LRN.a['p.creds'] || [];
  const used = new Set();
  const recs = rows.slice().sort((a,b)=>b.gap-a.gap).map(r=>{
    const pool = LRN_SOLUTIONS[r.ar.id] || [];
    const scored = SOLUTIONS.filter(s=>pool.includes(s.id))
      .filter(s=>!(s.id==='capm' && held.includes('capm')) && !(s.id==='pmp' && held.includes('pmp')) && !(s.id==='acp' && held.includes('acp')))
      .map(s=>{
        const sponsored = LEARNER_ENABLED.includes(s.id);
        let f = (sponsored?22:0) + fmtMatch(s) + (r.gap/4);
        if(['library','standards','members'].includes(s.id)) f -= 12;   /* broad, always-on: useful but never the headline */
        if(['pgmp','pfmp'].includes(s.id) && ['a','b','c'].includes(LRN.a['p.years'])) f -= 30;
        if(s.k==='advisory' || s.k==='licence') f -= 18;
        if(s.id==='capm' && ['d','e'].includes(LRN.a['p.years'])) f -= 25;
        if(s.id==='pmp' && ['a'].includes(LRN.a['p.years'])) f -= 25;
        return {s, sponsored, f, price:priceOf(s)};
      })
      .sort((a,b)=>b.f-a.f);
    /* no solution is recommended twice — the area with the bigger gap keeps it */
    let list = scored.filter(x=>!used.has(x.s.id)).slice(0,3);
    if(list.length < 2) list = list.concat(scored.filter(x=>used.has(x.s.id) && !list.some(y=>y.s.id===x.s.id))
                                                 .slice(0, 2-list.length).map(x=>Object.assign({repeat:true}, x)));
    list.forEach(x=>used.add(x.s.id));
    return {r, list};
  }).filter(x=>x.list.length);

  return {caps, rows, strengths, growth, arch, mean, recs, early};
}

/* ============================ SHARED QUESTION RENDERER ============================ */
let AUTOADV = true;
function toggleAuto(){ AUTOADV=!AUTOADV; const el=document.getElementById('autoAdv'); if(el) el.className='toggle'+(AUTOADV?' on':''); }

function qBody(q, val, ns){
  const set = ns+'Set', tog = ns+'Toggle', alc = ns+'Alloc';
  if(q.type==='scale'){
    const a = q.anchors || SC5;
    return `<fieldset class="optlist" style="border:0;padding:0;margin:0">
      <legend class="sr-only">${q.q}</legend>
      <div class="scale" role="radiogroup">
        ${a.map((lab,i)=>{const v=i+1; return `
          <label class="sbtn${val===v?' on':''}">
            <input type="radio" name="${q.key}" value="${v}" ${val===v?'checked':''} class="sr-only"
                   onchange="${set}('${q.key}',${v})">
            <span class="n">${v}</span><span class="l">${lab}</span>
          </label>`}).join('')}
      </div>
      <div class="scale-ends"><span>${a[0]}</span><span>${a[a.length-1]}</span></div>
      <div class="qna"><button class="btn btn-sm btn-quiet" onclick="${set}('${q.key}','na')">
        ${val==='na'?'✓ ':''}Not applicable to my scope</button></div>
    </fieldset>`;
  }
  if(q.type==='single' || q.type==='scen'){
    /* on a judgement question the rationale stays hidden until you commit,
       otherwise it is a reading test rather than a judgement one */
    const reveal = q.type!=='scen' || val!==undefined;
    return `<fieldset class="optlist"><legend class="sr-only">${q.q}</legend>
      ${q.opts.map(o=>`
        <label class="opt${q.type==='scen'&&val!==undefined&&val!==o.v?' dim':''}">
          <input type="radio" name="${q.key}" value="${o.v}" ${val===o.v?'checked':''} onchange="${set}('${q.key}','${o.v}')">
          <span class="mk" aria-hidden="true"><i></i></span>
          <span><span class="ot">${o.t}</span>${o.d&&reveal?`<span class="od">${o.d}</span>`:''}</span>
        </label>`).join('')}
      ${q.type==='scen' ? `<div class="asm-hint" style="margin-top:6px">${val===undefined
        ? svg('info',12)+' No trick answer. Once you commit, you will see what each option costs you.'
        : svg('check',12)+' Every option has a reason someone would pick it — that is what the rationale under each one is for.'}</div>` : ''}
    </fieldset>`;
  }
  if(q.type==='multi'){
    const sel = Array.isArray(val)?val:[];
    return `<fieldset class="optlist"><legend class="sr-only">${q.q}</legend>
      ${q.opts.map(o=>`
        <label class="opt cb">
          <input type="checkbox" value="${o.v}" ${sel.includes(o.v)?'checked':''}
                 onchange="${tog}('${q.key}','${o.v}',${q.max||0},${o.excl?'true':'false'})">
          <span class="mk" aria-hidden="true"><i></i></span>
          <span><span class="ot">${o.t}</span>${o.d?`<span class="od">${o.d}</span>`:''}</span>
        </label>`).join('')}
      ${q.max?`<div class="asm-hint" style="margin-top:4px">Choose up to ${q.max} · ${sel.length} selected</div>`:''}
    </fieldset>`;
  }
  if(q.type==='alloc'){
    const cur = val || {};
    const total = Object.values(cur).reduce((a,b)=>a+b,0);
    const left = 100-total;
    return `<div class="alloc">
      ${q.opts.map(o=>`
        <div class="alloc-row">
          <label class="an" for="al_${o.v}">${o.t}<small>${o.d||''}</small></label>
          <input id="al_${o.v}" type="range" min="0" max="100" step="5" value="${cur[o.v]||0}"
                 aria-label="${o.t} — points out of 100"
                 oninput="${alc}('${q.key}','${o.v}',this.value)">
          <span class="av" id="alv_${o.v}">${cur[o.v]||0}</span>
        </div>`).join('')}
      <div class="alloc-total ${total===100?'ok':(total>100?'over':'')}">
        ${svg(total===100?'check':'info',15)}
        <span>${total===100 ? 'All 100 points allocated.' : (total>100 ? `<b>${total}</b> points allocated — ${total-100} too many.` : `<b>${total}</b> of 100 allocated · <b>${left}</b> left to distribute.`)}</span>
      </div>
    </div>`;
  }
  return '';
}

function runnerShell(ns, run, qs, opts){
  const q = qs[run.idx];

  const pct = Math.round(run.idx/qs.length*100);

  const ok = answered(q,val);
  const isLast = run.idx===qs.length-1;
  return `

    <div class="row1">
      <span class="qcount"><b>${run.idx+1}</b> of ${qs.length}</span>
