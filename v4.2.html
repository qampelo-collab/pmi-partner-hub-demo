/* ---------- results ---------- */
function bandChip(score){ const b=bandOf(score);
  return `<span class="band" style="background:${b.bg};color:${b.color}">${b.name}</span>`; }

function quadChart(pri){
  const W=580,H=400,P={l:56,r:20,t:22,b:46};
  const maxImp = Math.max(30, ...pri.map(p=>p.imp));
  const x = v => P.l + (v/100)*(W-P.l-P.r);
  const y = v => H-P.b - (v/maxImp)*(H-P.t-P.b);
  const midX = x(50), midY = y(maxImp/2);

  /* place labels: right of the dot by default, flipped left when that would
     collide with a label already placed, nudged down as a last resort */
  const placed=[];
  const pts = pri.map(p=>{
    const cx=x(p.gap), cy=y(p.imp);
    let side = cx > W-170 ? -1 : 1, dy = 4, tries=0;
    const w = p.vp.short.length*6.4;
    const hits = () => placed.some(q=>{
      const ax0 = side>0 ? cx+18 : cx-18-w, ax1 = side>0 ? cx+18+w : cx-18;
      return Math.abs((cy+dy)-q.y) < 15 && ax0 < q.x1 && ax1 > q.x0;
    });
    while(hits() && tries<3){ tries++; if(tries===1 && cx>P.l+90) side=-side; else dy += 16; }
    const x0 = side>0 ? cx+18 : cx-18-w, x1 = side>0 ? cx+18+w : cx-18;
    placed.push({x0,x1,y:cy+dy});
    return {p, cx, cy, side, dy};
  });

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" role="img"
    aria-label="Priority matrix. ${pri.map(p=>`${p.vp.short}: gap ${p.gap}, importance ${p.imp}`).join('. ')}.">
    <rect x="${midX}" y="${P.t}" width="${W-P.r-midX}" height="${midY-P.t}" fill="#4F17A8" opacity=".055"/>
    <line x1="${P.l}" y1="${midY}" x2="${W-P.r}" y2="${midY}" stroke="#E3DED5" stroke-dasharray="4 4"/>
    <line x1="${midX}" y1="${P.t}" x2="${midX}" y2="${H-P.b}" stroke="#E3DED5" stroke-dasharray="4 4"/>
    <line x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}" stroke="#C9C2B6"/>
    <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${H-P.b}" stroke="#C9C2B6"/>
    <text x="${P.l}" y="${H-16}" font-size="11" fill="#5A5A6E">Smaller gap</text>
    <text x="${W-P.r}" y="${H-16}" text-anchor="end" font-size="11" fill="#5A5A6E">Larger gap</text>
    <text x="${W/2}" y="${H-2}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5A5A6E" letter-spacing=".05em">DISTANCE FROM WHERE YOU WANT TO BE</text>
    <text x="18" y="${(P.t+H-P.b)/2}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5A5A6E" letter-spacing=".05em"
          transform="rotate(-90 18 ${(P.t+H-P.b)/2})">IMPORTANCE YOU ASSIGNED</text>
    <text x="${W-P.r-6}" y="${P.t+12}" text-anchor="end" font-size="10" font-weight="700" fill="#4F17A8" letter-spacing=".06em">DO THIS FIRST</text>
    ${pts.map(o=>{ const b=bandOf(o.p.score);
      return `<g>
        <circle cx="${o.cx}" cy="${o.cy}" r="16" fill="${b.color}" opacity=".14"/>
        <circle cx="${o.cx}" cy="${o.cy}" r="8.5" fill="${b.color}"/>
        <text x="${o.side>0?o.cx+18:o.cx-18}" y="${o.cy+o.dy}" font-size="11.5" font-weight="650" fill="#200F3B"
              text-anchor="${o.side>0?'start':'end'}">${o.p.vp.short}</text>
      </g>`}).join('')}
  </svg>`;
}

function relWhy(r, R){
  const secQ = ORG_Q.find(q=>q.id==='sector');
  const sec = (secQ.opts.find(o=>o.v===R.sector)||{}).t || 'your sector';
  const pfQ = ORG_Q.find(q=>q.id==='portfolio');
  const picked = (ASM.a['org.portfolio']||[]).map(v=>(pfQ.opts.find(o=>o.v===v)||{}).t).filter(Boolean);
  const lifted = picked.filter(t=>{
    const v=(pfQ.opts.find(o=>o.t===t)||{}).v;
    return PORTFOLIO_LIFT[v] && PORTFOLIO_LIFT[v][r.dom.id];
  });
  if(r.rel==='na') return `Nothing in ${sec.toLowerCase()} — and nothing you listed in your portfolio — needs it`;
  if(lifted.length) return `${sec}, and you named ${lifted.map(t=>t.toLowerCase()).join(' and ')}`;
  if(r.rel==='primary') return `Standard for ${sec.toLowerCase()}`;
  if(r.rel==='relevant') return `Applies to part of a ${sec.toLowerCase()} portfolio`;
  return `Rarely central in ${sec.toLowerCase()}, but not irrelevant`;
}

}
function lrnToggle(k,v,max,excl){
  let cur = Array.isArray(LRN.a[k])?LRN.a[k].slice():[];
  const qs=lrnQuestions(), q=qs[LRN.idx];
  const exclOpts=(q.opts||[]).filter(o=>o.excl).map(o=>o.v);
  if(cur.includes(v)) cur=cur.filter(x=>x!==v);
  else { if(excl) cur=[v]; else { cur=cur.filter(x=>!exclOpts.includes(x)); if(max&&cur.length>=max) cur.shift(); cur.push(v);} }
  LRN.a[k]=cur; lrnPaint();
}

function approveReq(id){
  const r = REQUESTS.find(x=>x.id===id); if(!r || r.st!=='Pending') return;
  const cc = ccById(r.cc);
  if(cc.spent + r.amount > cc.budget){
    openModal(`

        <p style="color:var(--muted);font-size:12.5px;margin-top:4px">Approving this would take the cost centre ${money(cc.spent+r.amount-cc.budget)} over its allocation.</p></div>

        <div class="kv"><dt>Request</dt><dd>${SOLUTIONS.find(s=>s.id===r.sid).n}</dd>
          <dt>Amount</dt><dd class="mono">${money(r.amount)}</dd>
          <dt>Cost centre</dt><dd>${cc.n} · ${money(cc.budget-cc.spent)} remaining</dd>
          <dt>Unallocated balance</dt><dd class="mono">${money(fundsFree())}</dd></div>
        <p style="font-size:12.5px;color:var(--muted);margin-top:14px">Move budget from the unallocated balance, or decline and let the cost-centre owner re-prioritise.</p>
      </div>
      <div class="modal-f"><button class="btn btn-ghost" onclick="closeAll()">Cancel</button>
        <button class="btn btn-primary" onclick="topUpCC('${cc.id}',${r.amount});closeAll();approveReq('${id}')">Top up ${cc.n} and approve</button></div>`);
    return;
  }
  cc.spent += r.amount; FUNDS.drawn += r.amount;
  r.st='Approved'; r.stc='good';
  TXNS.unshift({d:'Today', ref:r.id, desc:SOLUTIONS.find(s=>s.id===r.sid).n.split('—')[0].trim()+' — '+r.who, cc:r.cc, amt:-r.amount, bal:fundsFree()});
  go('budget'); toast(`${r.who} approved — ${money(r.amount)} drawn from ${cc.n}`);
}
function declineReq(id){
  const r=REQUESTS.find(x=>x.id===id); if(!r) return;
  r.st='Declined'; r.stc=''; r.note='Declined — no budget in this cycle. Suggested a sponsored alternative.';
  go('budget'); toast(`${r.who} notified, with the reason and an alternative`);
}

  const cc=ccById(id); const room=fundsFree();

function a11ySweep(){
  document.querySelectorAll('.toggle').forEach(t=>{
    if(!t.getAttribute('role')){
      t.setAttribute('role','switch'); t.setAttribute('tabindex','0');
      t.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); t.click(); }});
    }
    t.setAttribute('aria-checked', t.classList.contains('on')?'true':'false');
  });
  document.querySelectorAll('.bar').forEach(b=>{
    if(!b.getAttribute('role')){
      const i=b.querySelector('i');
      b.setAttribute('role','progressbar'); b.setAttribute('aria-valuemin','0'); b.setAttribute('aria-valuemax','100');
      b.setAttribute('aria-valuenow', i?String(parseInt(i.style.width)||0):'0');
    }
  });
  document.querySelectorAll('.fchip, .tab').forEach(c=>{
    if(!c.hasAttribute('aria-pressed') && !c.hasAttribute('aria-selected'))
      c.setAttribute('aria-pressed', c.classList.contains('on')||c.classList.contains('active') ? 'true':'false');
  });
}

/* focus handling for drawer and modal */
let LAST_FOCUS = null;
const _openDrawer = openDrawer, _openModal = openModal, _closeAll = closeAll;
function trapIn(el){
  LAST_FOCUS = document.activeElement;
  el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
  setTimeout(()=>{
    const f = el.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if(f) f.focus();
  },30);
}
openDrawer = function(html){ _openDrawer(html); trapIn(document.getElementById('drawer')); };
openModal  = function(html){ _openModal(html);  trapIn(document.getElementById('modal')); };
closeAll = function(){
  const wasOpen = document.getElementById('drawer').classList.contains('open') || document.getElementById('modal').classList.contains('open');
  _closeAll();
  if(wasOpen && LAST_FOCUS && document.contains(LAST_FOCUS)){ LAST_FOCUS.focus(); LAST_FOCUS=null; }
};
document.addEventListener('keydown', e=>{
  if(e.key!=='Tab') return;
  const open = document.querySelector('.drawer.open, .modal.open');
  if(!open) return;
  const f = [...open.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
  if(!f.length) return;
  const first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

/* ============================================================================
   LEARNER ACCESS MODEL
   "Enabled for the organisation" and "allocated to you" are different things.
   Five states, one source of truth, and no enterprise pricing ever reaches a
   learner. All figures illustrative.
   ============================================================================ */

/* Seats your organisation actually holds. pool:null = subscription, no seat limit. */
const SEATS = {
  capm:{pool:400, used:318}, pmp:{pool:1200, used:1064}, acp:{pool:320, used:318},
  t4t:{pool:6000, used:5210}, studyhall:{pool:900, used:842}, bootcamp:{pool:60, used:60},
  aiseries:{pool:2000, used:1743}, members:{pool:3400, used:3128},
  paths:{pool:null, used:0}, library:{pool:null, used:0}, standards:{pool:null, used:0}
};

/* Individual rates — a different commercial object from the enterprise unit price,
   and the ONLY monetary figure a learner is ever shown. Deliberately higher than the
   organisation pays: that difference is the argument for asking your employer first.
   Invented for the prototype. Not PMI pricing. */
const IPRICE = {
  capm:795, pmp:1395, acp:1195, pgmp:2650, pfmp:2850, rmp:1295, sp:1295, pba:1295,
  cp:3250, cpmai:2495, cspp:2100, pmocp:2295, studyhall:179, bootcamp:1650, da:1095,
  aiseries:385, sustpath:650, members:139, library:89, standards:65, t4t:null, paths:null
};
/* what an individual can consume at all — everything else is an organisational engagement */
const LRN_CATALOGUE = SOLUTIONS.filter(s =>
  LEARNER_ENABLED.includes(s.id) || IPRICE[s.id] > 0
).map(s=>s.id);

const seatsFree = sid => { const s=SEATS[sid]; if(!s) return 0; return s.pool===null ? Infinity : Math.max(0, s.pool-s.used); };

/* the single function every learner surface must go through */
function laState(sid){
  const s = SOLUTIONS.find(x=>x.id===sid);
  const assigned = LEARNER.goals.find(g=>g.sid===sid);
  const activeM  = LEARNER.active.includes(sid);
  const started  = LEARNER.started && LEARNER.started.includes(sid);
  const owned    = LEARNER_ENABLED.includes(sid);
  const free     = seatsFree(sid);
  const price    = IPRICE[sid] || null;
  const selfPay  = ADMIN_CFG.allowSelfPay && price > 0;
  const pending  = REQUESTS.find(r=>r.who===LRN_NAME && r.sid===sid && r.st==='Pending');
  const declined = REQUESTS.find(r=>r.who===LRN_NAME && r.sid===sid && r.st==='Declined');
  const bought   = (LEARNER.selfBought||[]).includes(sid);

  if(bought)    return {k:'bought',   s, label:'You bought this', chip:'good'};
  if(assigned)  return {k:'assigned', s, label:'Assigned by Northwind', chip:'', goal:assigned};
  if(activeM)   return {k:'active',   s, label:'Active', chip:'good'};
  if(started)   return {k:'started',  s, label:'In progress', chip:'good'};
  if(pending)   return {k:'pending',  s, label:pending.type==='seat'?'On the waitlist':'Request with your L&D team', chip:'warn', req:pending};
  if(owned && free > 0)  return {k:'included', s, label:'Included by Northwind', chip:'good', free};
  if(owned && free === 0) return {k:'waitlist', s, label:'All seats in use', chip:'warn'};
  return {k:'open', s, label:'Not enabled by Northwind', chip:'', price, selfPay, declined};
}

/* what the learner sees where a price would otherwise sit */
function laMoney(st){

/* ============================================================================
   REQUEST → ORGANISATIONAL IMPACT
   A learner request is not only a spending decision. If it lands in a value play
   the organisation is weak at and cares about, approving it is capability work
   that funded itself. The admin should not have to work that out.
   ============================================================================ */

const IMPACT = {
  listed_top:{name:'On your list · top priority', color:'#166F4A', bg:'#E7F3EE', rank:0},
  top:       {name:'Supports a top priority',    color:'#166F4A', bg:'#E7F3EE', rank:1},
  listed:    {name:'On your recommendation list',color:'#00799E', bg:'#EEF6F8', rank:2},
  gap:       {name:'Supports a known gap',       color:'#00799E', bg:'#EEF6F8', rank:3},
  outside:   {name:'Outside current priorities', color:'#5A5A6E', bg:'#F1EFEA', rank:4},
  unknown:   {name:'No assessment yet',          color:'#B0790C', bg:'#FBF2DF', rank:5},
  none:      {name:'—',                          color:'#5A5A6E', bg:'#F1EFEA', rank:6}
};

function reqImpact(r){
  const s = SOLUTIONS.find(x=>x.id===r.sid);
  if(!s) return {level:'none', line:''};
  const vp = vpById(s.vp);
  if(!ASM || !ASM.done)
    return {level:'unknown', vp,
      line:`This sits in <b>${vp.short}</b>. Run the Organisation Value Assessment and requests like this are scored against your own priorities automatically.`,
      cta:{label:'Run the assessment', fn:"go('orgassess')"}};

  const R = ASM.results;
  const pr = R.priorities.find(p=>p.vp.id===s.vp);
  const rank = R.priorities.indexOf(pr)+1;
  const onList = R.recs.some(rec=>rec.list.some(x=>x.s.id===s.id));
  const b = bandOf(pr.score);
  const where = `<b>${vp.short}</b> is ranked <b>#${rank}</b> of six at ${pr.score} (${b.name})`;

  let level, line;
  if(onList && rank<=3){
    level='listed_top';
    line = `${where} — and this exact solution is on the recommendation list your own assessment produced. Someone is asking you to fund what you had already decided to do.`;
  } else if(onList){
    level='listed';
    line = `${where}. Not your first move, but this exact solution is on the recommendation list your assessment produced, so it is already scoped work.`;
  } else if(rank<=2){
    level='top';
    line = `${where} — your highest-impact area. Capability work here was going to need funding regardless.`;
  } else if(rank<=4 && pr.score<55){
    level='gap';
    line = `${where}. Middle of your priority list, and weak enough that it is a real gap rather than a preference.`;
  } else {
    level='outside';
    line = `${where} — one of your stronger areas, and not a current priority. Worth deciding on individual merit rather than organisational need.`;
  }
  return {level, vp, rank, score:pr.score, band:b, onList, line};
}

const REQ_TYPE = {
  funding:{n:'Full funding', ic:'wallet'},
  split:  {n:'Part funding', ic:'handshake'},

               <div class="u">${r.orgShare<100 ? `${r.orgShare}% of ${money(r.fullPrice||r.amount)} · ${r.who.split(' ')[0]} covers ${money((r.fullPrice||r.amount)-r.amount)}` : 'individual rate'}</div>`}

      ${r.profile ? `

          ${svg('users',13)} ${r.who.split(' ')[0]} attached their Skill &amp; Ambition Profile — ${r.profile.arch}${r.profile.focus?` · ${r.profile.focus} is ${r.profile.focusGap} points below target`:''} ${svg('arrowdown',12)}
        </button>
        <div class="rq-profbody">
          <div class="rq-lab" style="margin-bottom:8px">Shared voluntarily, for this request only${r.profile.target?` · aiming at: ${r.profile.target}`:''}</div>
          ${r.profile.rows.map(x=>`
            <div class="caprow" style="padding:7px 0">
              <span class="cn" style="min-width:150px">${x.n}</span>
              <span class="cb"><i style="width:${x.now}%;background:var(--violet)"></i><u style="left:${x.want}%"></u></span>
              <span class="cv"><b>${x.now}</b> → ${x.want}</span>

        </div>
      </div>` : ''}

  }).join('');

/* ---------- unmet demand: the buying signal ---------- */
function unmetDemand(){
  const open = REQUESTS.filter(r=>{
    const s=SOLUTIONS.find(x=>x.id===r.sid);
    return s && !s.owned && r.type!=='seat';
  });
  if(!open.length) return '';
  const byVP = {};
  open.forEach(r=>{ const s=SOLUTIONS.find(x=>x.id===r.sid); (byVP[s.vp]=byVP[s.vp]||[]).push(r); });
  const rows = Object.entries(byVP).map(([vpid,rs])=>{
    const vp=vpById(vpid);
    const pr = (ASM && ASM.done) ? ASM.results.priorities.find(p=>p.vp.id===vpid) : null;
    const rank = pr ? ASM.results.priorities.indexOf(pr)+1 : null;
    return {vp, rs, pr, rank, total:rs.reduce((a,r)=>a+(r.amount||0),0)};
  }).sort((a,b)=>(a.rank||9)-(b.rank||9) || b.rs.length-a.rs.length);

  return `
  <div class="card" style="margin-bottom:18px">
    <div class="card-h"><div><h3>What your people are asking for that you have not bought</h3>
      <div class="sub">Individual requests, grouped by value play, against your own capability priorities</div></div>
      <div class="right"><button class="btn btn-sm btn-ghost" onclick="go('catalog')">Open catalogue</button></div></div>
    <div class="card-b">
      ${rows.map(g=>`
        <div class="demandrow">
          <span class="dm-ic" style="background:${g.vp.color}1A;color:${inkOf(g.vp.color)}">${svg(g.vp.icon,15)}</span>
          <div style="flex:1;min-width:180px">
            <b style="font-size:13.5px;display:block">${g.vp.short}</b>
            <span style="font-size:11.5px;color:var(--muted)">${[...new Set(g.rs.map(r=>SOLUTIONS.find(x=>x.id===r.sid).n.split('—')[0].trim()))].join(' · ')}</span>
          </div>
          <div style="flex:none;text-align:right;min-width:120px">
            <div style="font-weight:750;font-size:15px">${g.rs.length} request${g.rs.length===1?'':'s'}</div>
            <div style="font-size:11.5px;color:var(--muted)">${g.total?money(g.total)+' asked for':'no cost attached'}</div>
          </div>
          <div style="flex:none;min-width:170px;text-align:right">
            ${g.pr
              ? `<span class="band" style="background:${bandOf(g.pr.score).bg};color:${bandOf(g.pr.score).color}">#${g.rank} priority · ${g.pr.score}</span>`
              : `<span class="chip sm">No assessment yet</span>`}
          </div>
        </div>`).join('')}
      ${(ASM && ASM.done && rows.some(g=>g.rank<=3))
        ? `<div class="notice" style="margin-top:14px;background:var(--good-soft);border-color:#CDE6DB">${svg('check',15)}<span><b>Demand is pointing at your own priorities.</b> ${rows.filter(g=>g.rank<=3).map(g=>g.vp.short).join(' and ')} ${rows.filter(g=>g.rank<=3).length>1?'are':'is'} in your top three, and people are asking for solutions there unprompted. That is a stronger buying case than a forecast.</span></div>`
        : `<div class="notice" style="margin-top:14px">${svg('info',15)}<span>Individual requests are the cheapest demand signal you will get. Several people asking for the same thing usually means one licence rather than three approvals.</span></div>`}
    </div>
  </div>`;
}

/* ============================================================================
   v4.2 — ADMIN ROLES AND ORGANISATION STRUCTURE

   Design note, because the obvious build is wrong.

   "Three admin levels" sounds like one ladder. It is not. Two independent
   things are being described:

     CAPABILITY — what kind of decision you are allowed to make.
     SCOPE      — how much of the organisation you make it for.

   They do not correlate. The Group L&D operations person administers the whole
   enterprise and has no budget authority and no interest in strategy. A
   division director has narrow scope and complete authority inside it. A single
   1-2-3 ladder cannot express either, so this build keeps them separate: three
   ROLES, each carrying a SCOPE.

   The second principle, and the one that shapes every screen:

     You see the decisions you can make, and the evidence for them.
     Everything else is available on request, not by default.

   Which produces the counter-intuitive result that the Sponsor — the most
   senior role, with access to everything — has the SMALLEST default navigation.
   An executive handed fifteen menu items uses none of them.
   ============================================================================ */

  }

function escalateReq(id){
  const r=REQUESTS.find(x=>x.id===id); if(!r) return;
  const s=SOLUTIONS.find(x=>x.id===r.sid);
  if(ESCALATIONS.some(e=>e.linked===id && e.st==='Pending')){ toast('Already with the Sponsor'); return; }
  ESCALATIONS.unshift({id:'ESC-'+(205+ESCALATIONS.length), from:myName(), fromRole:ROLE, kind:'approval',
    when:'Just now', st:'Pending', stc:'warn',
    title:`Funding request above my approval ceiling`,
    body:`${r.who} (${r.dept}): “${r.why}”`,
    ask:`Approve ${money(r.amount)} for ${s.n.split('—')[0].trim()}. My ceiling is ${money(myCeiling())}.`,
    amount:r.amount, unit:r.cc, linked:id});
  r.st='Escalated'; r.stc='warn';
  go('decisions'); toast(`Escalated to Marta Lindqvist — ${r.who} has been told it is with the Sponsor`);
}

function decideEsc(id, ok){
  const e=ESCALATIONS.find(x=>x.id===id); if(!e) return;
  e.st = ok?'Approved':'Declined'; e.stc = ok?'good':'';
  if(ok && e.linked){ const r=REQUESTS.find(x=>x.id===e.linked); if(r){ r.st='Pending'; approveReq(e.linked); } }
  if(ok && e.kind==='budget' && e.unit){ const c=ccById(e.unit); c.budget += e.amount; FUNDS.allocated += e.amount;
    const a=ADMINS.find(x=>x.scope===e.unit); if(a) a.budget = c.budget; }
  if(ok && e.kind==='seats'){ if(SEATS.pmp) SEATS.pmp.pool += 20; }
  if(ok && e.kind==='access'){ (ALSO_ALLOWED.admin||[]).push('reports'); }
  e.note = ok ? `Approved by ${myName()}.` : `Declined by ${myName()} — not a current capability priority.`;
  go('decisions');
  toast(ok ? `Approved — ${e.from} notified` : `Declined — ${e.from} sees the reason`);
}

function submitEscalate(){

  if(t.length<8 || ask.length<5){ toast('A title and a clear ask are the two parts that get read'); return; }
  ESCALATIONS.unshift({id:'ESC-'+(205+ESCALATIONS.length), from:myName(), fromRole:ROLE, kind:ESC.kind,
    when:'Just now', st:'Pending', stc:'warn', title:t, body:bdy||'—', ask:ask,
    amount:parseInt(g('escAmt').replace(/[^0-9]/g,''),10)||0, unit:myScope()==='enterprise'?null:myScope()});
  closeAll(); go('decisions'); toast('Sent to Marta Lindqvist');
}
function openAccessRequest(view){
  const list = ON_REQUEST[ROLE]||[];
  const pick = view ? list.find(x=>x[0]===view) : null;
  openEscalate({kind:'access',
    title: pick ? `Access to ${pick[1]}` : 'Additional access',
    body: pick ? `${pick[2]}.` : '',
    ask: pick ? `Grant ${pick[1]} to my role.` : 'Grant additional access to my role.'});

let AP_ROLE='manager';
function pickApRole(r){
  AP_ROLE=r;
  ['manager','admin'].forEach(x=>{const b=document.getElementById('apR_'+x); if(b){b.className='cs'+(x===r?' on':''); b.setAttribute('aria-checked', x===r);}});
  const hint=document.getElementById('apRoleHint'), row=document.getElementById('apScopeRow'), bud=document.getElementById('apBudget');
  if(hint) hint.textContent = r==='manager'
    ? 'Owns the people in one unit and decides funding up to a ceiling you set.'
    : 'Runs the hub across the enterprise. No budget authority — they escalate spending to you.';
  if(row) row.style.display = r==='manager' ? '' : 'none';
  if(bud) bud.closest('.field').style.display = r==='manager' ? '' : 'none';
}
function doAppoint(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  const name=g('apPerson'), scope = AP_ROLE==='manager' ? g('apScope') : 'enterprise';
  const ceiling = AP_ROLE==='manager' ? parseInt(g('apCeil'),10) : 0;
  const budget = AP_ROLE==='manager' ? (parseInt(g('apBudget').replace(/[^0-9]/g,''),10)||0) : null;
  ADMINS.push({id:'A'+(ADMINS.length+1), name:name, title: AP_ROLE==='manager' ? 'Head of '+unitById(scope).n : 'Learning Operations',
    role:AP_ROLE, scope:scope, by:myName(), since:'Today', budget:budget, ceiling:ceiling, last:'Not yet signed in'});
  if(budget){ const cc=ccById(scope); cc.budget += budget; FUNDS.allocated += budget; }
  closeAll(); go('orgaccess');
  toast(`${name} appointed as ${roleById(AP_ROLE).name}${AP_ROLE==='manager'?' for '+unitById(scope).n:''} — invitation sent`);
}
function openDelegate(id){
  const a=ADMINS.find(x=>x.id===id); if(!a) return;
  const u = a.scope==='enterprise' ? null : unitById(a.scope);
  openModal(`

}
function saveDelegate(id){
  const a=ADMINS.find(x=>x.id===id); if(!a) return;
  const c=document.getElementById('dgCeil'), b=document.getElementById('dgBudget');
  if(c) a.ceiling=parseInt(c.value,10);
  if(b){ const nv=parseInt(b.value.replace(/[^0-9]/g,''),10)||0; const cc=ccById(a.scope);
         FUNDS.allocated += (nv-(a.budget||0)); cc.budget += (nv-(a.budget||0)); a.budget=nv; }
  closeAll(); go('orgaccess'); toast(`${a.name} updated${c?` — ceiling now ${money(a.ceiling)}`:''}`);
}
function revokeAdmin(id){
  const a=ADMINS.find(x=>x.id===id); if(!a) return;
  openModal(`
    <div class="modal-h"><h3 style="font-size:16px">Revoke ${a.name}?</h3>
      <p style="color:var(--muted);font-size:12.5px;margin-top:4px">${roleById(a.role).name}${a.scope!=='enterprise'?' · '+unitById(a.scope).n:''}</p></div>
    <div class="modal-b">
      <p style="font-size:13px;color:var(--ink-2);line-height:1.6">Their access ends immediately. ${a.role==='manager'?`Open requests from ${unitById(a.scope).n} come to you until someone else is appointed, and the delegated ${money(a.budget||0)} returns to the unallocated balance.`:'Anything they had in progress stays; the audit trail keeps their name against it.'}</p>
      <div class="notice" style="margin-top:14px">${svg('info',15)}<span>Recorded in Activity &amp; Audit with your name and today's date.</span></div>
    </div>
    <div class="modal-f"><button class="btn btn-ghost" onclick="closeAll()">Cancel</button>
      <span class="spacer"></span>
      <button class="btn btn-accent" onclick="doRevoke('${id}')">Revoke access</button></div>`);
}
function doRevoke(id){
  const i=ADMINS.findIndex(x=>x.id===id); if(i<0) return;
  const a=ADMINS[i];
  if(a.budget){ const cc=ccById(a.scope); cc.budget-=a.budget; FUNDS.allocated-=a.budget; }
  ADMINS.splice(i,1); closeAll(); go('orgaccess'); toast(`${a.name} revoked`);
}

            <span style="flex:1"><span class="t">${r.who} · ${s.n.split('—')[0].trim()}</span>
              <span class="d">${r.type==='split'?`Offering to cover ${100-r.orgShare}% · `:''}${money(r.amount)}${ov?' · above your ceiling':''}</span></span>
            <span class="r"><button class="btn btn-sm ${ov?'btn-ghost':'btn-primary'}" onclick="${ov?`escalateReq('${r.id}')`:`approveReq('${r.id}')`}">${ov?'Escalate':'Approve'}</button></span>
          </li>`}).join('')}</ul>`
        : `<div class="empty" style="padding:22px">${svg('check',18)}<div style="margin-top:6px">Nothing waiting.</div></div>`}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><div><h3>Where the unit is weakest</h3><div class="sub">From ${tp.done} anonymous profiles</div></div></div>
      <div class="card-b">
        ${worst?`
          ${tp.rows.slice().sort((a,b)=>(b[2]-b[1])-(a[2]-a[1])).slice(0,3).map(r=>{const ar=LRN_AREAS.find(a=>a.id===r[0]);
            return `<div class="caprow" style="padding:9px 0">
              <span class="cn">${ar.name}<small>${r[2]-r[1]} points below what the roles need</small></span>
              <span class="cb"><i style="width:${r[1]}%;background:${inkOf(ar.color)}"></i><u style="left:${r[2]}%"></u></span>
              <span class="cv"><b>${r[1]}</b> → ${r[2]}</span></div>`}).join('')}
          <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:12px" onclick="go('myteam')">See the whole picture</button>`
        : `<div class="empty" style="padding:22px">Not enough profiles yet.</div>`}
      </div>
    </div>
  </div>`;
}

/* ---------- Capability Sponsor: five things, everything else one click away ---------- */
function dashSponsor(){
  const pend = ESCALATIONS.filter(e=>e.st==='Pending');
  const openReq = REQUESTS.filter(r=>r.st==='Pending');
  const noMgr = ORG.units.filter(u=>!ADMINS.some(a=>a.role==='manager'&&a.scope===u.id));
  const stale = ADMINS.filter(a=>/Never|weeks/.test(a.last));
  const done = ASM && ASM.done;
  const top = done ? ASM.results.priorities.slice(0,3) : [];
  return `
  <div class="pagehead"><div>
    <div class="crumbs">Capability Sponsor · ${ORG.name}</div>
    <h1>Good afternoon, Marta</h1>
    <p class="sub">Five things, because you do not run this hub — you decide about it. Everything your administrators use is still here, folded away at the bottom of the menu.</p>
  </div><div class="actions">
    <button class="btn btn-ghost" onclick="go('orgaccess')">${svg('layers',15)} Delegation</button>
    <button class="btn btn-primary" onclick="go('decisions')">${svg('flag',15)} ${pend.length} decision${pend.length===1?'':'s'}</button>
  </div></div>

  ${done ? '' : recoBanner('admin')}

  <div class="grid g-4" style="margin-bottom:18px">
    <div class="kpi"><div class="lab">Capability position</div><div class="val">${done?ASM.results.overall:'—'}${done?'<small> / 100</small>':''}</div>
      <div class="delta flat">${done?bandOf(ASM.results.overall).name+' · '+ASM.depth+' depth':'no baseline yet'}</div></div>
    <div class="kpi"><div class="lab">Decisions waiting</div><div class="val">${pend.length}</div><div class="delta flat">${money(pend.reduce((a,e)=>a+(e.amount||0),0))} at stake</div></div>
    <div class="kpi"><div class="lab">Committed spend</div><div class="val" style="font-size:20px">${money(FUNDS.drawn)}</div><div class="track"><i style="width:${pct(FUNDS.drawn,FUNDS.commitment)}%;background:var(--violet)"></i></div></div>
    <div class="kpi"><div class="lab">Delegation health</div><div class="val">${noMgr.length+stale.length?noMgr.length+stale.length:'OK'}</div>
      <div class="delta ${(noMgr.length+stale.length)?'warn':'flat'}" style="color:${(noMgr.length+stale.length)?'#8A5E08':''}">${noMgr.length?noMgr.length+' unit unmanaged · ':''}${stale.length} inactive administrator${stale.length===1?'':'s'}</div></div>
  </div>

  <div class="grid g-32" style="margin-bottom:18px">
    <div class="card">
      <div class="card-h"><div><h3>${done?'Your three priorities':'Where you stand'}</h3>
        <div class="sub">${done?'From your own assessment — everything else is ranked below these':'Nothing is prioritised until the baseline exists'}</div></div>
        <div class="right"><button class="btn btn-sm btn-ghost" onclick="go('orgassess')">${done?'Full results':'Start'}</button></div></div>
      <div class="card-b">
        ${done?top.map((p,i)=>{const b=bandOf(p.score);
          return `<div class="vprow">
            <span class="vpic" style="background:${p.vp.color}1A;color:${inkOf(p.vp.color)}">${svg(p.vp.icon,17)}</span>
            <span class="vpn"><b>${i+1}. ${p.vp.short}</b><span>${p.vp.oneLiner}</span></span>
            <span class="vpbar"><i style="width:${p.score}%;background:${b.color}"></i><u style="left:${VP_BENCH[p.vp.id]}%"></u></span>
            <span class="vpsc" style="color:${b.color}">${p.score}</span></div>`}).join('')
        : `<div class="empty" style="padding:26px">${svg('target',22)}<div style="margin-top:8px">No capability baseline yet. Until it exists, every request that reaches you is judged on how well it is argued rather than on what the organisation needs.</div>
           <button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="go('orgassess')">Run it — five minutes is enough to start</button></div>`}
      </div>
    </div>
    <div class="card">
      <div class="card-h"><div><h3>Waiting on you</h3><div class="sub">Everything else was decided without you</div></div>
        <div class="right"><button class="btn btn-sm btn-ghost" onclick="go('decisions')">Open</button></div></div>
      <div class="card-b" style="padding-top:8px">
        ${pend.length?`<ul class="list-clean">${pend.slice(0,4).map(e=>{const K=ESC_KIND[e.kind]||ESC_KIND.policy;
          return `<li class="li"><span class="ic" style="background:${K.c}1A;color:${inkOf(K.c)}">${svg(K.ic,15)}</span>
            <span style="flex:1"><span class="t">${e.title}</span><span class="d">${e.from} · ${e.ask}</span></span>
            ${e.amount?`<span class="r mono" style="font-weight:700">${money(e.amount)}</span>`:''}</li>`}).join('')}</ul>`
        : `<div class="empty" style="padding:22px">${svg('check',18)}<div style="margin-top:6px">Nothing. Your delegation is doing its job.</div></div>`}
        <div class="hr" style="margin:12px 0"></div>
        <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)">
          <span>${openReq.length} requests being handled by your managers</span>
          <button class="btn btn-sm btn-quiet" style="padding:0;height:auto" onclick="go('decisions')">See them</button>
        </div>
      </div>
    </div>
  </div>

  ${unmetDemand()}

  <div class="card">
    <div class="card-b" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <span style="width:36px;height:36px;border-radius:9px;background:var(--bg);color:var(--muted);display:grid;place-items:center;flex:none">${svg('layers',17)}</span>
      <div style="flex:1;min-width:260px">
        <b style="font-size:13.5px;display:block;margin-bottom:2px">Everything the administrators use is still here</b>
        <span style="font-size:12.5px;color:var(--muted)">People, seats, agreements, the catalogue, the audit trail — ${OPS_VIEWS.length} views, folded away rather than removed. Open them when you have a reason to.</span>
      </div>
      <button class="btn btn-ghost btn-sm" style="flex:none" onclick="SHOW_OPS=true;renderNav();toast('Operational views added to your menu')">${svg('arrowdown',13)} Show operational detail</button>
    </div>
  </div>`;
}

/* ============================ INIT ============================ */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeAll(); if(document.activeElement) document.activeElement.blur(); }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||''));
  if(e.key==='/' && !typing){ e.preventDefault(); const s=document.querySelector('.gsearch input'); if(s) s.focus(); }
});
document.getElementById('aiIconBtn').innerHTML = svg('spark',17);
paintRoleBtn();
renderNav();
go('dashboard');
</script>
</body>
</html>
