<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PMI Enterprise Partner Hub — Admin Console (Illustrative Demo)</title>
<style>
:root{
  --ink:#200F3B;
  --ink-2:#453a63;
  --muted:#5A5A6E;
  --bg:#F7F4EF;
  --surface:#FFFFFF;
  --line:#E3DED5;
  --line-soft:#EFEAE2;
  --violet:#4F17A8;
  --violet-2:#6B32C9;
  --violet-soft:#F1EBFB;
  --aqua:#00799E;
  --aqua-soft:#EEF6F8;
  --cyan:#05BFE0;
  --orange:#FF610F;
  --orange-dk:#D5340B;
  --tan:#BE9577;
  --amber:#B0790C;
  --good:#166F4A;
  --good-soft:#E7F3EE;
  --warn:#B0790C;
  --warn-soft:#FBF2DF;
  --crit:#C0301C;
  --crit-soft:#FBEBE8;
  --c1:#6B32C9; --c2:#00799E; --c3:#D5340B; --c4:#0E96B0; --c5:#B0790C;
  --radius:10px;
  --radius-lg:14px;
  --shadow:0 1px 2px rgba(32,15,59,.06), 0 6px 20px rgba(32,15,59,.05);
  --shadow-lg:0 18px 50px rgba(32,15,59,.18);
  --sidebar:264px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Aptos","Aptos Display","Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.011em}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}
input,select,textarea{font:inherit; color:inherit}
a{color:var(--violet); text-decoration:none}
table{border-collapse:collapse; width:100%}

/* ---------- App shell ---------- */
.app{display:grid; grid-template-columns:var(--sidebar) 1fr; min-height:100vh}

/* Topbar */
.topbar{
  position:sticky; top:0; z-index:60; grid-column:1 / -1;
  display:flex; align-items:center; gap:16px;
  height:58px; padding:0 18px;
  background:var(--ink); color:#fff;
}
.topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
  background:linear-gradient(90deg,var(--violet) 0%,var(--violet-2) 18%,var(--aqua) 38%,var(--cyan) 56%,var(--orange) 78%,var(--orange-dk) 100%);
}
.envchip.demo{background:rgba(255,97,15,.2); color:#FFB68C; border-color:rgba(255,97,15,.42)}
.brand{display:flex; align-items:center; gap:10px; min-width:calc(var(--sidebar) - 18px)}
.brand .mark{
  width:30px;height:30px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--violet-2),var(--cyan)); font-weight:800; font-size:12px; letter-spacing:.02em;
}
.brand .name{font-weight:700; font-size:14.5px; letter-spacing:-.01em}
.brand .sub{font-size:10.5px; color:#B9AEDC; letter-spacing:.06em; text-transform:uppercase; margin-top:-2px}
.orgswitch{
  display:flex; align-items:center; gap:9px; padding:6px 11px; border-radius:8px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.14); cursor:pointer;
}
.orgswitch .logo{width:20px;height:20px;border-radius:4px;background:#fff;color:var(--ink);display:grid;place-items:center;font-size:9.5px;font-weight:800}
.orgswitch .t{font-size:12.5px; font-weight:600}
.orgswitch .c{font-size:10.5px; color:#B9AEDC}
.gsearch{flex:1; max-width:460px; position:relative}
.gsearch input{
  width:100%; height:34px; border-radius:8px; padding:0 12px 0 34px;
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.14); color:#fff; outline:none;
}
.gsearch input::placeholder{color:#A79BCF}
.gsearch input:focus{background:rgba(255,255,255,.16); border-color:var(--cyan)}
.gsearch .ico{position:absolute; left:11px; top:8px; opacity:.75}
.tb-right{margin-left:auto; display:flex; align-items:center; gap:8px}
.iconbtn{
  position:relative; width:34px;height:34px;border-radius:8px; display:grid;place-items:center;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.13);
}
.iconbtn:hover{background:rgba(255,255,255,.16)}
.dot{position:absolute; top:6px; right:6px; width:7px;height:7px;border-radius:50%; background:var(--orange); border:1.5px solid var(--ink)}
.badge-count{
  position:absolute; top:-5px; right:-5px; min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--orange); color:#fff; font-size:10px; font-weight:700; display:grid;place-items:center; border:1.5px solid var(--ink)
}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--aqua),var(--violet-2));display:grid;place-items:center;font-size:11.5px;font-weight:700}
.envchip{
  font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  padding:4px 8px; border-radius:5px; background:rgba(5,191,224,.16); color:var(--cyan); border:1px solid rgba(5,191,224,.3);
}

/* Sidebar */
.sidebar{
  position:sticky; top:58px; align-self:start; height:calc(100vh - 58px); overflow-y:auto;
  background:var(--surface); border-right:1px solid var(--line); padding:14px 12px 30px;
}
.navgroup{margin-bottom:16px}
.navgroup h5{
  margin:0 0 6px 10px; font-size:10px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:#8C86A0;
}
.navitem{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 10px; border-radius:8px; font-size:13.3px; font-weight:500; color:var(--ink-2);
  margin-bottom:1px;
}
.navitem:hover{background:var(--bg)}
.navitem.active{background:var(--violet-soft); color:var(--violet); font-weight:650}
.navitem.active svg{color:var(--violet)}
.navitem svg{width:17px;height:17px;flex:none;color:#8C86A0}
.navitem .pill{
  margin-left:auto; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:20px;
  background:var(--violet); color:#fff;
}
.navitem .pill.alt{background:var(--orange)}
.navitem .pill.ghost{background:var(--line-soft); color:var(--muted)}
.sidefoot{
  margin:18px 6px 0; padding:12px; border-radius:var(--radius); background:var(--aqua-soft);
  border:1px solid #D7E9EF;
}
.sidefoot h6{margin:0 0 4px; font-size:12px; font-weight:700}
.sidefoot p{font-size:11.5px; color:var(--muted); margin-bottom:8px}

/* Main */
.main{padding:22px 26px 60px; max-width:1560px}
.pagehead{display:flex; align-items:flex-start; gap:18px; margin-bottom:20px; flex-wrap:wrap}
.pagehead h1{font-size:23px}
.pagehead .sub{color:var(--muted); font-size:13.4px; margin-top:3px; max-width:760px}
.pagehead .actions{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap}
.crumbs{font-size:11.5px; color:var(--muted); margin-bottom:6px; letter-spacing:.02em}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 14px; border-radius:8px;
  font-size:13px; font-weight:600; border:1px solid transparent; white-space:nowrap;
}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--violet); color:#fff}
.btn-primary:hover{background:#3F0F8C}
.btn-ghost{background:var(--surface); border-color:var(--line); color:var(--ink)}
.btn-ghost:hover{border-color:#C9C0B2; background:#FCFAF7}
.btn-quiet{background:transparent; color:var(--violet)}
.btn-quiet:hover{background:var(--violet-soft)}
.btn-accent{background:var(--orange); color:#fff}
.btn-accent:hover{background:var(--orange-dk)}
.btn-sm{height:28px; padding:0 10px; font-size:12.2px; border-radius:7px}
.btn-sm svg{width:13px;height:13px}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* Cards & layout */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow)}
.card-h{display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--line-soft)}
.card-h h3{font-size:14.5px}
.card-h .sub{font-size:12px; color:var(--muted)}
.card-h .right{margin-left:auto; display:flex; gap:8px; align-items:center}
.card-b{padding:18px}
.card-b.tight{padding:0}
.grid{display:grid; gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-23{grid-template-columns:2fr 1fr}
.g-32{grid-template-columns:1.6fr 1fr}
@media(max-width:1300px){.g-4{grid-template-columns:repeat(2,1fr)} .g-3{grid-template-columns:repeat(2,1fr)} .g-23,.g-32{grid-template-columns:1fr}}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}

/* KPI tiles */
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:15px 16px; box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px; font-weight:600; color:var(--muted); letter-spacing:.02em; display:flex; align-items:center; gap:6px}
.kpi .val{font-size:29px; font-weight:700; letter-spacing:-.025em; margin:5px 0 2px; font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px; font-weight:600; color:var(--muted); letter-spacing:0}
.kpi .delta{font-size:11.8px; font-weight:600; display:flex; align-items:center; gap:5px}
.up{color:#166F4A} .down{color:var(--crit)} .flat{color:var(--muted)}
.kpi .spark{margin-top:9px}
.kpi .track{height:5px;border-radius:3px;background:var(--line-soft); overflow:hidden; margin-top:9px}
.kpi .track i{display:block;height:100%;border-radius:3px}

/* Chips / tags */
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px;
  font-size:11.4px; font-weight:600; border:1px solid var(--line); background:var(--bg); color:var(--ink-2);
}
.chip.violet{background:var(--violet-soft); border-color:#DFD1F6; color:var(--violet)}
.chip.aqua{background:var(--aqua-soft); border-color:#CFE5EC; color:var(--aqua)}
.chip.orange{background:#FEEEE6; border-color:#F8D6C4; color:var(--orange-dk)}
.chip.good{background:var(--good-soft); border-color:#CDE6DB; color:#166F4A}
.chip.warn{background:var(--warn-soft); border-color:#EEDDB4; color:#8A5E08}
.chip.crit{background:var(--crit-soft); border-color:#F3CFC8; color:var(--crit)}
.chip.tan{background:#F7F0E9; border-color:#E7D8C7; color:#7A5B3E}
.chip i{width:6px;height:6px;border-radius:50%; background:currentColor; display:block}
.chip.sm{font-size:10.6px; padding:2px 7px}

/* Filter bar */
.filters{
  display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 14px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:16px;
}
.fchip{
  padding:6px 12px; border-radius:20px; font-size:12.6px; font-weight:600;
  border:1px solid var(--line); background:var(--bg); color:var(--ink-2);
}
.fchip:hover{border-color:#C9C0B2}
.fchip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.sel, .txt{
  height:32px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
  padding:0 10px; font-size:12.8px; outline:none;
}
.sel:focus,.txt:focus{border-color:var(--violet)}
.searchwrap{position:relative}
.searchwrap .txt{padding-left:30px; min-width:250px}
.searchwrap svg{position:absolute; left:9px; top:8px; width:15px;height:15px; color:var(--muted)}
.spacer{margin-left:auto}

/* Tables */
.tbl{font-size:13px}
.tbl th{
  text-align:left; font-size:10.6px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  font-weight:700; padding:10px 14px; border-bottom:1px solid var(--line); background:#FCFAF7; position:sticky; top:0;
}
.tbl td{padding:11px 14px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
.tbl tbody tr:hover{background:#FCFAF7}
.tbl .num{text-align:right; font-variant-numeric:tabular-nums}
.tbl .strong{font-weight:650}
.tbl .sub{font-size:11.5px; color:var(--muted)}
.checkcell{width:36px}
input[type=checkbox]{width:15px;height:15px; accent-color:var(--violet); cursor:pointer}
.tblwrap{overflow:auto; max-height:none}
.avatar-sm{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.person{display:flex; align-items:center; gap:9px}

/* Progress bars */
.bar{height:7px; border-radius:4px; background:var(--line-soft); overflow:hidden; min-width:90px}
.bar i{display:block;height:100%; border-radius:4px; background:var(--violet)}
.barlab{display:flex; align-items:center; gap:9px}
.barlab .pct{font-size:11.8px; font-weight:650; color:var(--muted); min-width:34px; text-align:right; font-variant-numeric:tabular-nums}

/* Solution cards */
.solgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:15px}
.sol{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:0; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s;
}
.sol:hover{transform:translateY(-2px); box-shadow:0 10px 30px rgba(32,15,59,.10); border-color:#D6CDBE}
.sol .stripe{height:4px}
.sol .body{padding:15px 16px 0; flex:1}
.sol .top{display:flex; align-items:flex-start; gap:10px; margin-bottom:9px}
.sol h4{font-size:14.3px; line-height:1.3}
.sol .kind{font-size:10.4px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
.sol p.desc{font-size:12.5px; color:var(--muted); line-height:1.48; margin-bottom:11px}
.sol .meta{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.sol .foot{
  display:flex; align-items:center; gap:8px; padding:11px 16px; border-top:1px solid var(--line-soft); background:#FCFAF7;
}
.sol .price{font-size:12.5px; font-weight:650}
.sol .price small{font-weight:500; color:var(--muted)}
.sol .foot .btns{margin-left:auto; display:flex; gap:6px}
.owned{outline:1.5px solid #CDE6DB}
.ribbon{
  position:absolute; top:10px; right:-1px; font-size:10px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; padding:3px 9px; border-radius:5px 0 0 5px; background:var(--good-soft); color:#166F4A;
}

/* Domain banner */
.domains{display:grid; grid-template-columns:repeat(6,1fr); gap:11px; margin-bottom:18px}
@media(max-width:1300px){.domains{grid-template-columns:repeat(3,1fr)}}
.dom{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:13px 13px 12px; text-align:left; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.dom:hover{border-color:#C9C0B2}
.dom.on{border-color:var(--violet); box-shadow:0 0 0 2px var(--violet-soft)}
.dom .ic{width:28px;height:28px;border-radius:7px; display:grid;place-items:center; margin-bottom:9px}
.dom .ic svg{width:15px;height:15px;color:#fff}
.dom h4{font-size:12.6px; line-height:1.28; margin-bottom:3px}
.dom span{font-size:11px; color:var(--muted)}

/* Drawer */
.scrim{position:fixed; inset:0; background:rgba(32,15,59,.42); z-index:80; opacity:0; pointer-events:none; transition:opacity .18s}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; height:100vh; width:640px; max-width:94vw; background:var(--bg);
  z-index:90; box-shadow:var(--shadow-lg); transform:translateX(102%); transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
.drawer.open{transform:translateX(0)}
.drawer-h{padding:18px 22px; background:var(--surface); border-bottom:1px solid var(--line)}
.drawer-b{padding:20px 22px 30px; overflow-y:auto; flex:1}
.drawer-f{padding:14px 22px; background:var(--surface); border-top:1px solid var(--line); display:flex; gap:9px; align-items:center}
.closex{position:absolute; top:16px; right:18px; width:30px;height:30px;border-radius:7px; display:grid;place-items:center; color:var(--muted)}
.closex:hover{background:var(--line-soft)}

/* Modal */
.modal{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-48%) scale(.98); z-index:95;
  width:620px; max-width:94vw; max-height:88vh; background:var(--bg); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:.18s; display:flex; flex-direction:column;
}
.modal.open{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1)}
.modal-h{padding:17px 20px; background:var(--surface); border-bottom:1px solid var(--line); border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.modal-b{padding:18px 20px; overflow-y:auto}
.modal-f{padding:13px 20px; background:var(--surface); border-top:1px solid var(--line); display:flex; gap:9px; border-radius:0 0 var(--radius-lg) var(--radius-lg)}

/* Tabs */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto}
.tab{
  padding:9px 14px; font-size:13.2px; font-weight:600; color:var(--muted);
  border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--violet); border-bottom-color:var(--violet)}
.tab .n{font-size:11px; background:var(--line-soft); color:var(--muted); padding:1px 6px; border-radius:10px; margin-left:6px}
.tab.on .n{background:var(--violet-soft); color:var(--violet)}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block; font-size:12.2px; font-weight:650; margin-bottom:5px}
.field .hint{font-size:11.4px; color:var(--muted); margin-top:4px}
.field .txt, .field .sel, .field textarea{
  width:100%; border-radius:8px; border:1px solid var(--line); background:var(--surface); padding:8px 10px; outline:none; font-size:13px;
}
.field textarea{min-height:76px; resize:vertical; font-family:inherit}
.field .txt:focus,.field .sel:focus,.field textarea:focus{border-color:var(--violet); box-shadow:0 0 0 3px var(--violet-soft)}
.f2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.toggle{width:38px;height:21px;border-radius:12px;background:#CFC8BC; position:relative; transition:.15s; flex:none}
.toggle i{position:absolute; top:2.5px; left:2.5px; width:16px;height:16px;border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--violet)}
.toggle.on i{left:19.5px}
.setrow{display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--line-soft)}
.setrow:last-child{border-bottom:none}
.setrow .txtblk{flex:1}
.setrow .txtblk b{font-size:13.2px; font-weight:650; display:block}
.setrow .txtblk span{font-size:12px; color:var(--muted)}

/* Misc */
.notice{
  display:flex; gap:11px; padding:12px 14px; border-radius:var(--radius); font-size:12.6px;
  border:1px solid; align-items:flex-start;
}
.notice svg{width:16px;height:16px;flex:none;margin-top:1px}
.notice.info{background:var(--aqua-soft); border-color:#CFE5EC; color:#0A5A73}
.notice.warn{background:var(--warn-soft); border-color:#EEDDB4; color:#7A5305}
.notice.violet{background:var(--violet-soft); border-color:#DFD1F6; color:var(--violet)}
.notice b{font-weight:700}
.kv{display:grid; grid-template-columns:150px 1fr; gap:8px 14px; font-size:12.9px}
.kv dt{color:var(--muted)}
.kv dd{margin:0; font-weight:600}
.list-clean{list-style:none; padding:0; margin:0}
.li{display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line-soft); align-items:flex-start}
.li:last-child{border-bottom:none}
.li .ic{width:30px;height:30px;border-radius:8px; display:grid;place-items:center; flex:none}
.li .ic svg{width:15px;height:15px}
.li .t{font-size:13px; font-weight:600; display:block}
.li .d{font-size:11.8px; color:var(--muted); display:block; line-height:1.4}
.li .r{margin-left:auto; text-align:right; font-size:11.8px; color:var(--muted); white-space:nowrap}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.8px; color:var(--muted); margin-top:10px}
.legend span{display:flex; align-items:center; gap:6px}
.legend i{width:9px;height:9px;border-radius:3px; display:block}
.hr{height:1px; background:var(--line-soft); margin:16px 0}
.mono{font-variant-numeric:tabular-nums}
.empty{padding:40px; text-align:center; color:var(--muted); font-size:13px}
.hidden{display:none !important}
.stepper{display:flex; gap:0; margin-bottom:18px}
.step{flex:1; padding:9px 12px; background:var(--surface); border:1px solid var(--line); font-size:12.3px; font-weight:600; color:var(--muted); position:relative}
.step:first-child{border-radius:8px 0 0 8px}
.step:last-child{border-radius:0 8px 8px 0}
.step.done{background:var(--good-soft); color:#166F4A; border-color:#CDE6DB}
.step.now{background:var(--violet); color:#fff; border-color:var(--violet)}
.step .n{display:inline-grid; place-items:center; width:18px;height:18px;border-radius:50%; background:rgba(0,0,0,.08); font-size:10.5px; margin-right:7px}
.step.now .n{background:rgba(255,255,255,.25)}
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); z-index:120;
  background:var(--ink); color:#fff; padding:11px 18px; border-radius:9px; font-size:13px; font-weight:600;
  box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:.2s; display:flex; gap:9px; align-items:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.protobadge{
  position:fixed; bottom:14px; right:14px; z-index:70; font-size:10.4px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; padding:5px 10px; border-radius:20px; background:var(--ink); color:#fff; opacity:.72;
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D8D1C5; border-radius:10px; border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
</style>

/* sparkline / area chart */
function areaChart(data, color, w=560, h=150){
  const max=Math.max(...data)*1.12, min=0;
  const pts=data.map((v,i)=>[i/(data.length-1)*w, h - (v-min)/(max-min)*h]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${w} ${h} L 0 ${h} Z`;
  const grid=[0,.25,.5,.75,1].map(f=>`<line x1="0" y1="${(h*f).toFixed(1)}" x2="${w}" y2="${(h*f).toFixed(1)}" stroke="#EFEAE2" stroke-width="1"/>`).join('');
  const dots=pts.map((p,i)=>i===pts.length-1?`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.5" fill="${color}" stroke="#fff" stroke-width="2"/>`:'').join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id="g${color.slice(1)}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g${color.slice(1)})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}
function sparkline(data,color,w=110,h=26){
  const max=Math.max(...data),min=Math.min(...data);
  const pts=data.map((v,i)=>`${(i/(data.length-1)*w).toFixed(1)},${(h-(v-min)/((max-min)||1)*h*0.82-2).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" style="display:block"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function hbars(rows,max){
  return `<div style="display:flex;flex-direction:column;gap:11px">`+rows.map(r=>`
    <div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:5px">
        <span style="font-size:12.6px;font-weight:600">${r.n}</span>
        <span style="margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums">${r.lab}</span>
      </div>
      <div style="height:9px;border-radius:5px;background:var(--line-soft);overflow:hidden;display:flex;gap:2px">
        <i style="display:block;height:100%;width:${(r.v/max*100).toFixed(1)}%;background:${r.c};border-radius:5px"></i>
        ${r.v2!==undefined?`<i style="display:block;height:100%;width:${((r.v2-r.v)/max*100).toFixed(1)}%;background:${r.c};opacity:.28;border-radius:0 5px 5px 0"></i>`:''}
      </div>
    </div>`).join('')+`</div>`;
}
function donut(segments,size=150){
  const total=segments.reduce((a,s)=>a+s.v,0); let acc=0; const r=size/2-14, c=size/2, circ=2*Math.PI*r;
  const arcs=segments.map(s=>{
    const frac=s.v/total, dash=`${(circ*frac-2).toFixed(1)} ${(circ-circ*frac+2).toFixed(1)}`;
    const off=circ*0.25 - circ*acc; acc+=frac;
    return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.c}" stroke-width="16" stroke-dasharray="${dash}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 ${c} ${c})" stroke-linecap="butt"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}">${arcs}<text x="${c}" y="${c-2}" text-anchor="middle" font-size="21" font-weight="700" fill="#200F3B">${total.toLocaleString()}</text><text x="${c}" y="${c+15}" text-anchor="middle" font-size="10.5" fill="#5A5A6E">seats</text></svg>`;
}

function filteredSolutions(){
  return SOLUTIONS.filter(s=>{
    if(STATE.catDomain!=='all' && s.d!==STATE.catDomain) return false;
    if(STATE.catKind!=='all' && s.k!==STATE.catKind) return false;
    if(STATE.catQuery){
      const q=STATE.catQuery.toLowerCase();
      if(!(s.n+' '+s.desc+' '+(s.tags||[]).join(' ')).toLowerCase().includes(q)) return false;
    }
    return true;
  });
}
